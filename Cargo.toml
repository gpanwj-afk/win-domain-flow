[package]
name = "win-domain-flow"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Windows application and domain traffic monitor with optional browser activity diagnostics"
repository = "https://github.com/gpanwj-afk/win-domain-flow"
publish = false
default-run = "win-domain-flow-gui"

[lib]
name = "win_domain_flow"
path = "src/lib.rs"

[[bin]]
name = "win-domain-flow"
path = "src/main.rs"

[[bin]]
name = "win-domain-flow-gui"
path = "src/bin/gui.rs"

[dependencies]
anyhow = "=1.0.101"
clap = { version = "=4.6.5", features = ["derive"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
etherparse = "=0.21.0"
pcap = "=2.4.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.18"

[target.'cfg(windows)'.dependencies]
netstat2 = "=0.11.2"
sysinfo = "=0.37.2"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
