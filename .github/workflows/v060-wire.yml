name: v060-wire

on:
  push:
    branches:
      - agent/v060-reliability-e2e
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v060-reliability-e2e
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpcap-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Wire receiver reliability, single-instance UI, and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/browser_activity.rs")
          text = path.read_text()
          text = text.replace("use serde::Deserialize;", "use serde::{Deserialize, Serialize};", 1)
          text = text.replace(
              "use std::net::{TcpListener, TcpStream};",
              "use std::net::{SocketAddr, TcpListener, TcpStream};",
              1,
          )
          text = text.replace(
              "pub const BROWSER_DIAGNOSTICS_PORT: u16 = 38_765;",
              "pub const BROWSER_DIAGNOSTICS_PORT: u16 = 38_765;\n"
              "pub const BROWSER_EXTENSION_ID: &str = \"djfbcmjdmiligkpnejdipgnklmpgmaoj\";",
              1,
          )
          text = text.replace(
              "    #[error(\"browser diagnostics protocol error: {0}\")]\n    Protocol(&'static str),",
              "    #[error(\"browser diagnostics protocol error: {0}\")]\n"
              "    Protocol(&'static str),\n\n"
              "    #[error(\"browser diagnostics port {port} is already in use\")]\n"
              "    PortInUse { port: u16 },",
              1,
          )

          old_update = '''            occurred_at_ms = excluded.occurred_at_ms,
                      host = excluded.host,
                      url = excluded.url,
                      page_url = excluded.page_url,
                      initiator = excluded.initiator,
                      method = excluded.method,
                      resource_type = excluded.resource_type,
                      status_code = excluded.status_code,
                      mime = excluded.mime,
                      declared_bytes = COALESCE(excluded.declared_bytes, browser_request_event.declared_bytes),
                      transferred_bytes = COALESCE(excluded.transferred_bytes, browser_request_event.transferred_bytes),
                      protocol = COALESCE(excluded.protocol, browser_request_event.protocol),
                      from_cache = COALESCE(excluded.from_cache, browser_request_event.from_cache),
                      content_disposition = COALESCE(excluded.content_disposition, browser_request_event.content_disposition),
                      error_text = excluded.error_text'''
          new_update = '''            occurred_at_ms = excluded.occurred_at_ms,
                      host = excluded.host,
                      url = excluded.url,
                      page_url = COALESCE(excluded.page_url, browser_request_event.page_url),
                      initiator = COALESCE(excluded.initiator, browser_request_event.initiator),
                      method = COALESCE(excluded.method, browser_request_event.method),
                      resource_type = COALESCE(excluded.resource_type, browser_request_event.resource_type),
                      status_code = COALESCE(excluded.status_code, browser_request_event.status_code),
                      mime = COALESCE(excluded.mime, browser_request_event.mime),
                      declared_bytes = COALESCE(excluded.declared_bytes, browser_request_event.declared_bytes),
                      transferred_bytes = CASE
                          WHEN excluded.transferred_bytes IS NULL THEN browser_request_event.transferred_bytes
                          WHEN browser_request_event.transferred_bytes IS NULL THEN excluded.transferred_bytes
                          WHEN excluded.transferred_bytes > browser_request_event.transferred_bytes THEN excluded.transferred_bytes
                          ELSE browser_request_event.transferred_bytes
                      END,
                      protocol = COALESCE(excluded.protocol, browser_request_event.protocol),
                      from_cache = CASE
                          WHEN COALESCE(excluded.from_cache, 0) <> 0 OR COALESCE(browser_request_event.from_cache, 0) <> 0 THEN 1
                          ELSE 0
                      END,
                      content_disposition = COALESCE(excluded.content_disposition, browser_request_event.content_disposition),
                      error_text = COALESCE(excluded.error_text, browser_request_event.error_text)'''
          if old_update not in text:
              raise SystemExit("request upsert block not found")
          text = text.replace(old_update, new_update, 1)

          start = text.index("#[derive(Debug, Clone)]\npub struct BrowserServerStatus")
          end = text.index("struct HttpRequest {", start)
          server_section = r'''#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]
          pub struct BrowserServerStatus {
              pub product: String,
              pub pid: u32,
              pub port: u16,
              pub database_path: String,
              pub listening: bool,
              pub accepted_events: u64,
              pub last_event_ms: Option<u64>,
              pub last_error: Option<String>,
              pub expected_extension_id: String,
          }

          pub struct BrowserActivityServer {
              shutdown: Arc<AtomicBool>,
              listening: Arc<AtomicBool>,
              accepted_events: Arc<AtomicU64>,
              last_event_ms: Arc<AtomicU64>,
              last_error: Arc<Mutex<Option<String>>>,
              database_path: Arc<RwLock<PathBuf>>,
              port: u16,
              handle: Option<JoinHandle<()>>,
          }

          impl BrowserActivityServer {
              pub fn spawn(database_path: PathBuf) -> Result<Self, BrowserActivityError> {
                  Self::spawn_on(database_path, BROWSER_DIAGNOSTICS_PORT)
              }

              /// Starts the receiver on an explicit port. Passing port 0 asks the OS
              /// for an ephemeral port, which is useful for isolated integration tests.
              pub fn spawn_on(database_path: PathBuf, port: u16) -> Result<Self, BrowserActivityError> {
                  let listener = match TcpListener::bind(("127.0.0.1", port)) {
                      Ok(listener) => listener,
                      Err(error) if error.kind() == std::io::ErrorKind::AddrInUse => {
                          return Err(BrowserActivityError::PortInUse { port });
                      }
                      Err(error) => return Err(error.into()),
                  };
                  let actual_port = listener.local_addr()?.port();
                  listener.set_nonblocking(true)?;

                  let shutdown = Arc::new(AtomicBool::new(false));
                  let listening = Arc::new(AtomicBool::new(false));
                  let accepted_events = Arc::new(AtomicU64::new(0));
                  let last_event_ms = Arc::new(AtomicU64::new(0));
                  let last_error = Arc::new(Mutex::new(None));
                  let database_path = Arc::new(RwLock::new(database_path));

                  let worker_shutdown = Arc::clone(&shutdown);
                  let worker_listening = Arc::clone(&listening);
                  let worker_events = Arc::clone(&accepted_events);
                  let worker_last_event = Arc::clone(&last_event_ms);
                  let worker_error = Arc::clone(&last_error);
                  let worker_path = Arc::clone(&database_path);

                  let handle = thread::Builder::new()
                      .name("domainflow-browser-diagnostics".to_string())
                      .spawn(move || {
                          worker_listening.store(true, Ordering::SeqCst);
                          let mut storage_path = PathBuf::new();
                          let mut storage: Option<BrowserActivityStorage> = None;

                          while !worker_shutdown.load(Ordering::SeqCst) {
                              match listener.accept() {
                                  Ok((mut stream, _)) => {
                                      let requested_path = worker_path
                                          .read()
                                          .map(|value| value.clone())
                                          .unwrap_or_default();
                                      if requested_path != storage_path {
                                          match BrowserActivityStorage::open(&requested_path) {
                                              Ok(opened) => {
                                                  storage = Some(opened);
                                                  storage_path = requested_path;
                                              }
                                              Err(error) => {
                                                  set_last_error(&worker_error, error.to_string());
                                                  let _ = write_json_response(
                                                      &mut stream,
                                                      500,
                                                      r#"{"ok":false,"error":"database unavailable"}"#,
                                                      None,
                                                  );
                                                  continue;
                                              }
                                          }
                                      }

                                      let status = build_server_status(
                                          actual_port,
                                          &worker_path,
                                          &worker_listening,
                                          &worker_events,
                                          &worker_last_event,
                                          &worker_error,
                                      );
                                      match handle_connection(&mut stream, storage.as_mut(), &status) {
                                          Ok(accepted) => {
                                              if accepted {
                                                  worker_events.fetch_add(1, Ordering::Relaxed);
                                                  worker_last_event.store(
                                                      now_millis().max(0) as u64,
                                                      Ordering::Relaxed,
                                                  );
                                              }
                                          }
                                          Err(error) => {
                                              set_last_error(&worker_error, error.to_string());
                                          }
                                      }
                                  }
                                  Err(error) if error.kind() == std::io::ErrorKind::WouldBlock => {
                                      thread::sleep(Duration::from_millis(40));
                                  }
                                  Err(error) => {
                                      set_last_error(&worker_error, error.to_string());
                                      thread::sleep(Duration::from_millis(100));
                                  }
                              }
                          }
                          worker_listening.store(false, Ordering::SeqCst);
                      })?;

                  Ok(Self {
                      shutdown,
                      listening,
                      accepted_events,
                      last_event_ms,
                      last_error,
                      database_path,
                      port: actual_port,
                      handle: Some(handle),
                  })
              }

              pub fn set_database_path(&self, path: PathBuf) {
                  if let Ok(mut current) = self.database_path.write() {
                      *current = path;
                  }
              }

              pub fn port(&self) -> u16 {
                  self.port
              }

              pub fn status(&self) -> BrowserServerStatus {
                  build_server_status(
                      self.port,
                      &self.database_path,
                      &self.listening,
                      &self.accepted_events,
                      &self.last_event_ms,
                      &self.last_error,
                  )
              }

              pub fn shutdown(mut self) -> Result<(), BrowserActivityError> {
                  self.shutdown.store(true, Ordering::SeqCst);
                  let _ = TcpStream::connect(("127.0.0.1", self.port));
                  if let Some(handle) = self.handle.take() {
                      handle
                          .join()
                          .map_err(|_| BrowserActivityError::ThreadPanicked)?;
                  }
                  Ok(())
              }
          }

          impl Drop for BrowserActivityServer {
              fn drop(&mut self) {
                  self.shutdown.store(true, Ordering::SeqCst);
                  let _ = TcpStream::connect(("127.0.0.1", self.port));
                  if let Some(handle) = self.handle.take() {
                      let _ = handle.join();
                  }
              }
          }

          fn build_server_status(
              port: u16,
              database_path: &RwLock<PathBuf>,
              listening: &AtomicBool,
              accepted_events: &AtomicU64,
              last_event_ms: &AtomicU64,
              last_error: &Mutex<Option<String>>,
          ) -> BrowserServerStatus {
              let last = last_event_ms.load(Ordering::Relaxed);
              BrowserServerStatus {
                  product: "win-domain-flow".to_string(),
                  pid: std::process::id(),
                  port,
                  database_path: database_path
                      .read()
                      .map(|value| value.to_string_lossy().to_string())
                      .unwrap_or_default(),
                  listening: listening.load(Ordering::SeqCst),
                  accepted_events: accepted_events.load(Ordering::Relaxed),
                  last_event_ms: (last > 0).then_some(last),
                  last_error: last_error.lock().ok().and_then(|value| value.clone()),
                  expected_extension_id: BROWSER_EXTENSION_ID.to_string(),
              }
          }

          /// Probes an existing receiver without modifying its database or WAL.
          pub fn probe_server_status(port: u16) -> Result<Option<BrowserServerStatus>, BrowserActivityError> {
              let address = SocketAddr::from(([127, 0, 0, 1], port));
              let mut stream = match TcpStream::connect_timeout(&address, Duration::from_millis(300)) {
                  Ok(stream) => stream,
                  Err(error)
                      if matches!(
                          error.kind(),
                          std::io::ErrorKind::ConnectionRefused | std::io::ErrorKind::TimedOut
                      ) =>
                  {
                      return Ok(None);
                  }
                  Err(error) => return Err(error.into()),
              };
              stream.set_read_timeout(Some(Duration::from_secs(1)))?;
              stream.set_write_timeout(Some(Duration::from_secs(1)))?;
              stream.write_all(
                  format!(
                      "GET /status HTTP/1.1\r\nHost: 127.0.0.1:{port}\r\nConnection: close\r\n\r\n"
                  )
                  .as_bytes(),
              )?;
              stream.flush()?;
              let mut response = Vec::new();
              stream.read_to_end(&mut response)?;
              let Some(header_end) = find_bytes(&response, b"\r\n\r\n") else {
                  return Ok(None);
              };
              let headers = std::str::from_utf8(&response[..header_end])
                  .map_err(|_| BrowserActivityError::Protocol("status response is not UTF-8"))?;
              if !headers.starts_with("HTTP/1.1 200") {
                  return Ok(None);
              }
              let status: BrowserServerStatus = serde_json::from_slice(&response[header_end + 4..])?;
              if status.product != "win-domain-flow" {
                  return Ok(None);
              }
              Ok(Some(status))
          }

          fn handle_connection(
              stream: &mut TcpStream,
              storage: Option<&mut BrowserActivityStorage>,
              status: &BrowserServerStatus,
          ) -> Result<bool, BrowserActivityError> {
              stream.set_read_timeout(Some(Duration::from_secs(2)))?;
              stream.set_write_timeout(Some(Duration::from_secs(2)))?;
              let request = read_http_request(stream)?;
              let cors_origin = request
                  .origin
                  .as_deref()
                  .and_then(|origin| require_extension_origin(Some(origin)).ok());

              if request.method == "GET" && request.path == "/health" {
                  let body = serde_json::json!({
                      "ok": true,
                      "product": "win-domain-flow",
                      "pid": status.pid,
                      "port": status.port
                  })
                  .to_string();
                  write_json_response(stream, 200, &body, cors_origin.as_deref())?;
                  return Ok(false);
              }
              if request.method == "GET" && request.path == "/status" {
                  let body = serde_json::to_string(status)?;
                  write_json_response(stream, 200, &body, cors_origin.as_deref())?;
                  return Ok(false);
              }
              if request.method == "OPTIONS" && request.path == "/events" {
                  match require_extension_origin(request.origin.as_deref()) {
                      Ok(origin) => write_empty_response(stream, 204, Some(&origin))?,
                      Err(_) => write_json_response(
                          stream,
                          403,
                          r#"{"ok":false,"error":"extension origin required"}"#,
                          None,
                      )?,
                  }
                  return Ok(false);
              }
              if request.method != "POST" || request.path != "/events" {
                  write_json_response(
                      stream,
                      404,
                      r#"{"ok":false,"error":"not found"}"#,
                      cors_origin.as_deref(),
                  )?;
                  return Ok(false);
              }

              let origin = match require_extension_origin(request.origin.as_deref()) {
                  Ok(origin) => origin,
                  Err(_) => {
                      write_json_response(
                          stream,
                          403,
                          r#"{"ok":false,"error":"extension origin required"}"#,
                          None,
                      )?;
                      return Ok(false);
                  }
              };
              let payload: BrowserEventPayload = match serde_json::from_slice(&request.body) {
                  Ok(payload) => payload,
                  Err(_) => {
                      write_json_response(
                          stream,
                          400,
                          r#"{"ok":false,"error":"invalid JSON"}"#,
                          Some(&origin),
                      )?;
                      return Ok(false);
                  }
              };
              let Some(storage) = storage else {
                  write_json_response(
                      stream,
                      500,
                      r#"{"ok":false,"error":"database unavailable"}"#,
                      Some(&origin),
                  )?;
                  return Ok(false);
              };
              if storage.record(payload).is_err() {
                  write_json_response(
                      stream,
                      400,
                      r#"{"ok":false,"error":"invalid event"}"#,
                      Some(&origin),
                  )?;
                  return Ok(false);
              }
              write_json_response(
                  stream,
                  200,
                  r#"{"ok":true,"accepted":true}"#,
                  Some(&origin),
              )?;
              Ok(true)
          }

          '''
          text = text[:start] + server_section + text[end:]

          origin_start = text.index("fn allowed_extension_origin(")
          origin_end = text.index("fn cors_headers(", origin_start)
          origin_fn = r'''fn require_extension_origin(origin: Option<&str>) -> Result<String, BrowserActivityError> {
              let origin = origin
                  .map(str::trim)
                  .filter(|value| !value.is_empty())
                  .ok_or(BrowserActivityError::Protocol("missing extension origin"))?;
              let normalized = origin.trim_end_matches('/');
              let chrome = format!("chrome-extension://{BROWSER_EXTENSION_ID}");
              let edge = format!("edge-extension://{BROWSER_EXTENSION_ID}");
              if normalized == chrome || normalized == edge {
                  Ok(normalized.to_string())
              } else {
                  Err(BrowserActivityError::Protocol("unexpected extension origin"))
              }
          }

          '''
          text = text[:origin_start] + origin_fn + text[origin_end:]
          text = text.replace(
              '        400 => "Bad Request",\n        404 => "Not Found",',
              '        400 => "Bad Request",\n        403 => "Forbidden",\n        404 => "Not Found",',
              1,
          )

          old_origin_test = '''    #[test]
          fn only_extension_origins_are_allowed() {
              assert_eq!(
                  allowed_extension_origin(Some("chrome-extension://abcdefghijklmnop"))
                      .unwrap()
                      .as_deref(),
                  Some("chrome-extension://abcdefghijklmnop")
              );
              assert!(allowed_extension_origin(Some("https://example.com")).is_err());
              assert_eq!(allowed_extension_origin(None).unwrap(), None);
          }
          '''
          new_origin_test = '''    #[test]
          fn receiver_accepts_only_the_packaged_extension_origin() {
              let chrome = format!("chrome-extension://{BROWSER_EXTENSION_ID}");
              let edge = format!("edge-extension://{BROWSER_EXTENSION_ID}");
              assert_eq!(require_extension_origin(Some(&chrome)).unwrap(), chrome);
              assert_eq!(require_extension_origin(Some(&edge)).unwrap(), edge);
              assert!(require_extension_origin(None).is_err());
              assert!(require_extension_origin(Some("chrome-extension://wrongid")).is_err());
              assert!(require_extension_origin(Some("https://example.com")).is_err());
          }
          '''
          if old_origin_test not in text:
              raise SystemExit("origin test marker not found")
          text = text.replace(old_origin_test, new_origin_test, 1)

          request_test_marker = '''    #[test]
          fn download_updates_preserve_known_fields() {
          '''
          monotonic_test = '''    #[test]
          fn transferred_bytes_never_regress_to_zero() {
              let path = temp_db_path("monotonic_bytes");
              let mut storage = BrowserActivityStorage::open(&path).unwrap();
              let mut payload = request_payload();
              storage.record(payload.clone()).unwrap();
              payload.transferred_bytes = Some(0);
              payload.mime = None;
              storage.record(payload).unwrap();
              let rows = storage.recent_requests(Some("example.com"), 0, 10).unwrap();
              assert_eq!(rows[0].transferred_bytes, Some(8192));
              assert_eq!(rows[0].mime.as_deref(), Some("application/octet-stream"));
              cleanup(&path);
          }

          #[test]
          fn download_updates_preserve_known_fields() {
          '''
          if request_test_marker not in text:
              raise SystemExit("monotonic test marker not found")
          text = text.replace(request_test_marker, monotonic_test, 1)

          schema_marker = '''    #[test]
          fn existing_request_table_is_migrated_with_detail_columns() {
          '''
          tcp_tests = r'''    fn receiver_request(port: u16, method: &str, path: &str, origin: Option<&str>, body: &str) -> String {
              let mut stream = TcpStream::connect(("127.0.0.1", port)).unwrap();
              stream.set_read_timeout(Some(Duration::from_secs(2))).unwrap();
              let origin_header = origin.map_or_else(String::new, |value| format!("Origin: {value}\r\n"));
              let request = format!(
                  "{method} {path} HTTP/1.1\r\nHost: 127.0.0.1:{port}\r\n{origin_header}Content-Type: application/json\r\nContent-Length: {}\r\nConnection: close\r\n\r\n{body}",
                  body.len()
              );
              stream.write_all(request.as_bytes()).unwrap();
              stream.flush().unwrap();
              let mut response = String::new();
              stream.read_to_string(&mut response).unwrap();
              response
          }

          fn receiver_event(event_id: &str) -> String {
              serde_json::json!({
                  "kind": "request",
                  "eventId": event_id,
                  "timestampMs": 1000,
                  "host": "example.com",
                  "url": "https://example.com/asset.bin",
                  "resourceType": "fetch",
                  "transferredBytes": 4096
              })
              .to_string()
          }

          #[test]
          fn receiver_status_and_health_are_available_without_origin() {
              let path = temp_db_path("receiver_status");
              let server = BrowserActivityServer::spawn_on(path.clone(), 0).unwrap();
              let port = server.port();
              let health = receiver_request(port, "GET", "/health", None, "");
              assert!(health.starts_with("HTTP/1.1 200"));
              assert!(health.contains("win-domain-flow"));
              let status_response = receiver_request(port, "GET", "/status", None, "");
              assert!(status_response.starts_with("HTTP/1.1 200"));
              assert!(status_response.contains(&std::process::id().to_string()));
              assert!(status_response.contains(BROWSER_EXTENSION_ID));
              server.shutdown().unwrap();
              cleanup(&path);
          }

          #[test]
          fn receiver_rejects_missing_and_wrong_origins_but_accepts_packaged_extension() {
              let path = temp_db_path("receiver_auth");
              let server = BrowserActivityServer::spawn_on(path.clone(), 0).unwrap();
              let port = server.port();
              let body = receiver_event("auth-1");
              assert!(receiver_request(port, "POST", "/events", None, &body).starts_with("HTTP/1.1 403"));
              assert!(receiver_request(
                  port,
                  "POST",
                  "/events",
                  Some("chrome-extension://wrongid"),
                  &body
              )
              .starts_with("HTTP/1.1 403"));
              let origin = format!("chrome-extension://{BROWSER_EXTENSION_ID}");
              let accepted = receiver_request(port, "POST", "/events", Some(&origin), &body);
              assert!(accepted.starts_with("HTTP/1.1 200"));
              assert!(accepted.contains("\"accepted\":true"));
              server.shutdown().unwrap();
              let storage = BrowserActivityStorage::open(&path).unwrap();
              assert_eq!(storage.recent_requests(Some("example.com"), 0, 10).unwrap().len(), 1);
              cleanup(&path);
          }

          #[test]
          fn receiver_handles_bad_json_concurrency_path_switch_and_restart() {
              let first = temp_db_path("receiver_first");
              let second = temp_db_path("receiver_second");
              let server = BrowserActivityServer::spawn_on(first.clone(), 0).unwrap();
              let port = server.port();
              let origin = format!("chrome-extension://{BROWSER_EXTENSION_ID}");
              assert!(receiver_request(port, "POST", "/events", Some(&origin), "{").starts_with("HTTP/1.1 400"));

              let mut workers = Vec::new();
              for index in 0..8 {
                  let origin = origin.clone();
                  workers.push(thread::spawn(move || {
                      let body = receiver_event(&format!("concurrent-{index}"));
                      receiver_request(port, "POST", "/events", Some(&origin), &body)
                  }));
              }
              for worker in workers {
                  assert!(worker.join().unwrap().starts_with("HTTP/1.1 200"));
              }

              server.set_database_path(second.clone());
              let switched = receiver_event("switched-db");
              assert!(receiver_request(port, "POST", "/events", Some(&origin), &switched).starts_with("HTTP/1.1 200"));
              server.shutdown().unwrap();
              assert_eq!(BrowserActivityStorage::open(&first).unwrap().recent_requests(None, 0, 20).unwrap().len(), 8);
              assert_eq!(BrowserActivityStorage::open(&second).unwrap().recent_requests(None, 0, 20).unwrap().len(), 1);

              let restarted = BrowserActivityServer::spawn_on(second.clone(), port).unwrap();
              let probed = probe_server_status(port).unwrap().unwrap();
              assert_eq!(probed.pid, std::process::id());
              assert_eq!(probed.port, port);
              restarted.shutdown().unwrap();
              cleanup(&first);
              cleanup(&second);
          }

          #[test]
          fn existing_request_table_is_migrated_with_detail_columns() {
          '''
          if schema_marker not in text:
              raise SystemExit("TCP test insertion marker not found")
          text = text.replace(schema_marker, tcp_tests, 1)
          path.write_text(text)

          # Make browser diagnostics surface the owning PID and database path when
          # the fixed receiver port belongs to an existing instance.
          path = Path("src/browser_ui.rs")
          text = path.read_text()
          text = text.replace(
              "    BrowserActivityServer, BrowserActivityStorage, BrowserDownloadRow, BrowserRequestRow,\n    BrowserResourceSummaryRow, BrowserServerStatus, BROWSER_DIAGNOSTICS_PORT,",
              "    probe_server_status, BrowserActivityServer, BrowserActivityStorage, BrowserDownloadRow,\n    BrowserRequestRow, BrowserResourceSummaryRow, BrowserServerStatus, BROWSER_DIAGNOSTICS_PORT,",
              1,
          )
          old_new = '''        let (server, server_error) = match BrowserActivityServer::spawn(database_path.clone()) {
              Ok(server) => (Some(server), None),
              Err(error) => (None, Some(error.to_string())),
          };'''
          new_new = '''        let (server, server_error) = match BrowserActivityServer::spawn(database_path.clone()) {
              Ok(server) => (Some(server), None),
              Err(error) => {
                  let detail = probe_server_status(BROWSER_DIAGNOSTICS_PORT)
                      .ok()
                      .flatten()
                      .map(|status| {
                          format!(
                              "已有域流量管家实例占用 Receiver：PID {} · 数据库 {}",
                              status.pid, status.database_path
                          )
                      })
                      .unwrap_or_else(|| format!("Receiver 启动失败：{error}"));
                  (None, Some(detail))
              }
          };'''
          if old_new not in text:
              raise SystemExit("browser pane constructor marker not found")
          text = text.replace(old_new, new_new, 1)
          status_marker = '''                status_chip(
                      ui,
                      &format!("已接收 {} 条事件", format_integer(status.accepted_events)),
                      palette.blue,
                      palette,
                  );'''
          status_replacement = status_marker + '''
                  status_chip(
                      ui,
                      &format!("PID {} · 端口 {}", status.pid, status.port),
                      palette.blue,
                      palette,
                  );'''
          if status_marker not in text:
              raise SystemExit("browser status marker not found")
          text = text.replace(status_marker, status_replacement, 1)
          error_marker = '''            if let Some(error) = status.last_error {
                  ui.label(egui::RichText::new(error).color(palette.amber));
              }'''
          error_replacement = '''            ui.label(
                  egui::RichText::new(format!("Receiver 数据库：{}", status.database_path))
                      .small()
                      .color(palette.muted),
              );
              if let Some(error) = status.last_error {
                  ui.label(egui::RichText::new(error).color(palette.amber));
              }'''
          if error_marker not in text:
              raise SystemExit("browser status error marker not found")
          text = text.replace(error_marker, error_replacement, 1)
          path.write_text(text)

          # Refuse to start a second normal dashboard when /status proves that an
          # existing win-domain-flow receiver already owns the product port.
          path = Path("src/gui.rs")
          text = path.read_text()
          text = text.replace(
              "use crate::browser_ui::BrowserDiagnosticsPane;",
              "use crate::browser_activity::{probe_server_status, BrowserServerStatus, BROWSER_DIAGNOSTICS_PORT};\nuse crate::browser_ui::BrowserDiagnosticsPane;",
              1,
          )
          text = text.replace(
              "pub fn run() -> eframe::Result<()> {\n    let options = eframe::NativeOptions {",
              '''pub fn run() -> eframe::Result<()> {
              if let Ok(Some(status)) = probe_server_status(BROWSER_DIAGNOSTICS_PORT) {
                  return run_existing_instance_notice(status);
              }
              let options = eframe::NativeOptions {''',
              1,
          )
          capture_marker = "#[derive(Debug, Clone)]\nenum CaptureState {"
          conflict = r'''struct ExistingInstanceApp {
              status: BrowserServerStatus,
          }

          impl eframe::App for ExistingInstanceApp {
              fn update(&mut self, ctx: &egui::Context, _frame: &mut eframe::Frame) {
                  egui::CentralPanel::default().show(ctx, |ui| {
                      ui.heading("域流量管家已在运行");
                      ui.add_space(10.0);
                      ui.label(format!("已有实例 PID：{}", self.status.pid));
                      ui.label(format!("Receiver 端口：{}", self.status.port));
                      ui.label(format!("数据库：{}", self.status.database_path));
                      ui.add_space(10.0);
                      ui.label("请切换到已有窗口。为避免两个实例同时写库，本窗口不会启动第二套抓包或 Receiver。");
                  });
              }
          }

          fn run_existing_instance_notice(status: BrowserServerStatus) -> eframe::Result<()> {
              let options = eframe::NativeOptions {
                  viewport: egui::ViewportBuilder::default()
                      .with_inner_size([620.0, 260.0])
                      .with_min_inner_size([520.0, 220.0]),
                  renderer: eframe::Renderer::Glow,
                  ..Default::default()
              };
              eframe::run_native(
                  "域流量管家 · 已在运行",
                  options,
                  Box::new(move |_creation_context| Ok(Box::new(ExistingInstanceApp { status }))),
              )
          }

          #[derive(Debug, Clone)]
          enum CaptureState {'''
          if capture_marker not in text:
              raise SystemExit("GUI conflict insertion marker not found")
          text = text.replace(capture_marker, conflict, 1)
          text = text.replace(
              "        let settings = AppSettings::load();",
              "        let (settings, startup_notice) = AppSettings::load_with_notice();",
              1,
          )
          text = text.replace(
              "            notice: None,\n            browser_diagnostics:",
              "            notice: startup_notice.clone(),\n            browser_diagnostics:",
              1,
          )
          text = text.replace(
              "        app.refresh_data(false);\n        app",
              "        app.refresh_data(false);\n        if startup_notice.is_some() { app.notice = startup_notice; }\n        app",
              1,
          )
          text = text.replace(
              "    fn save_settings(&self) {\n        let _ = self.settings().save();\n    }",
              '''    fn save_settings(&mut self) {
              if let Err(error) = self.settings().save() {
                  self.notice = Some(format!("保存设置失败：{error}"));
              }
          }''',
              1,
          )
          text = text.replace("                self.notice = None;\n                self.save_settings();", "                self.save_settings();", 1)
          text = text.replace(
              "                if !matches!(self.state, CaptureState::Failed(_)) {\n                    self.notice = None;\n                }\n",
              "",
              1,
          )
          db_label = '''            ui.add_enabled(
                  self.capture.is_none(),
                  egui::TextEdit::singleline(&mut self.database_path)
                      .desired_width(ui.available_width()),
              );'''
          db_replacement = db_label + '''
              ui.label(
                  egui::RichText::new(format!("实际使用：{}", PathBuf::from(self.database_path.trim()).display()))
                      .small()
                      .color(palette.muted),
              );'''
          if db_label not in text:
              raise SystemExit("GUI database path marker not found")
          text = text.replace(db_label, db_replacement, 1)
          text = text.replace(
              "        self.save_settings();\n    }\n}\n\nimpl eframe::App for DashboardApp",
              "        let _ = self.settings().save();\n    }\n}\n\nimpl eframe::App for DashboardApp",
              1,
          )
          path.write_text(text)
          PY

          cargo fmt
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          node --check browser-extension/service_worker.js
          node --check browser-extension/popup.js

      - name: Commit wired product code and lockfile
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src/browser_activity.rs src/browser_ui.rs src/gui.rs
          if ! git diff --cached --quiet; then
            git commit -m "harden browser receiver and single-instance diagnostics"
            git pull --rebase origin agent/v060-reliability-e2e
            git push origin HEAD:agent/v060-reliability-e2e
          fi
