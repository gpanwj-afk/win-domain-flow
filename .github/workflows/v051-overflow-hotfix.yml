name: v051-overflow-hotfix

on:
  push:
    branches:
      - agent/v051-responsive-overflow-hotfix
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v051-responsive-overflow-hotfix
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpcap-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply responsive width hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gui = Path("src/gui.rs")
          text = gui.read_text()

          if 'if content_width >= 940.0 {' not in text:
              raise SystemExit("dashboard threshold marker not found")
          text = text.replace('if content_width >= 940.0 {', 'if content_width >= 980.0 {', 1)

          min_width_pattern = re.compile(
              r'\n\s*columns\[0\]\.set_min_width\(\(content_width \* 0\.38\)\.max\(340\.0\)\);'
          )
          text, count = min_width_pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit("forced first-column min width not found")

          old = '.show(ui, |ui| self.render_dashboard(ui, palette));'
          new = '''.show(ui, |ui| {
                          ui.set_width(viewport_width);
                          ui.set_max_width(viewport_width);
                          self.render_dashboard(ui, palette);
                      });'''
          if old not in text:
              raise SystemExit("dashboard scroll render marker not found")
          text = text.replace(old, new, 1)

          scroll_marker = '''            .show(ctx, |ui| {
                  egui::ScrollArea::vertical()'''
          if scroll_marker in text:
              text = text.replace(
                  scroll_marker,
                  '''            .show(ctx, |ui| {
                  let viewport_width = ui.available_width();
                  egui::ScrollArea::vertical()''',
                  1,
              )
          else:
              pattern = re.compile(
                  r'(\.show\(ctx, \|ui\| \{\s*)(egui::ScrollArea::vertical\(\)\s*'
                  r'\.id_salt\("main-dashboard-scroll"\))',
                  re.S,
              )
              text, count = pattern.subn(
                  r'\1let viewport_width = ui.available_width();\n                \2',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("central viewport insertion marker not found")

          gui.write_text(text)

          browser = Path("src/browser_ui.rs")
          text = browser.read_text()

          header_start = text.index('            ui.horizontal_wrapped(|ui| {\n                ui.vertical(|ui| {\n                    ui.heading(')
          header_end = text.index('            ui.add_space(8.0);\n            render_server_status(', header_start)
          header = '''            ui.heading(
                  egui::RichText::new("浏览器活动诊断")
                      .strong()
                      .color(palette.text),
              );
              ui.label(
                  egui::RichText::new(
                      "回答“这个域名具体在做什么”：网页请求、资源类型、MIME、来源页面与真实下载文件。",
                  )
                  .color(palette.muted),
              );
              ui.add_space(7.0);
              ui.horizontal_wrapped(|ui| {
                  if ui.button("立即刷新").clicked() {
                      self.refresh(period);
                  }
                  if ui.button("打开扩展安装目录").clicked() {
                      if let Err(error) = open_extension_folder() {
                          self.query_error = Some(error);
                      }
                  }
              });

          '''
          text = text[:header_start] + header + text[header_end:]

          filter_pattern = re.compile(
              r'(ui\.label\(egui::RichText::new\("域名筛选"\)\.color\(palette\.muted\)\);\s*)'
              r'(let changed = ui\s*\.add_sized\(\s*)\[340\.0, 30\.0\],',
              re.S,
          )
          text, count = filter_pattern.subn(
              r'\1let filter_width = ui.available_width().clamp(150.0, 340.0);\n                \2[filter_width, 30.0],',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("browser filter width marker not found")

          filename_pattern = re.compile(
              r'ui\.label\(egui::RichText::new\(filename\)\.strong\(\)\.color\(palette\.text\)\);'
          )
          text, count = filename_pattern.subn(
              '''ui.label(
                      egui::RichText::new(shorten(filename, 56))
                          .strong()
                          .color(palette.text),
                  )
                  .on_hover_text(filename);''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("download filename marker not found")

          browser.write_text(text)

          cargo = Path("Cargo.toml")
          text = cargo.read_text()
          if 'version = "0.5.0"' not in text:
              raise SystemExit("Cargo version marker not found")
          cargo.write_text(text.replace('version = "0.5.0"', 'version = "0.5.1"', 1))

          readme = Path("README.md")
          text = readme.read_text()
          if text.startswith('# win-domain-flow 0.5\n'):
              text = text.replace('# win-domain-flow 0.5\n', '# win-domain-flow 0.5.1\n', 1)
          elif text.startswith('# win-domain-flow 0.5.0\n'):
              text = text.replace('# win-domain-flow 0.5.0\n', '# win-domain-flow 0.5.1\n', 1)
          else:
              raise SystemExit("README version marker not found")
          readme.write_text(text)
          PY

      - name: Validate hotfix
        run: |
          cargo fmt
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          node --check browser-extension/service_worker.js
          node --check browser-extension/popup.js
          python3 -m json.tool browser-extension/manifest.json >/dev/null

      - name: Commit hotfix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README.md src/gui.rs src/browser_ui.rs
          git commit -m "fix responsive dashboard overflow"
          git push origin HEAD:agent/v051-responsive-overflow-hotfix
