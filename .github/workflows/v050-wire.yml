name: v050-wire

on:
  push:
    branches:
      - agent/v050-responsive-browser-diagnostics
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v050-responsive-browser-diagnostics
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpcap-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Wire responsive GUI and browser diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/gui.rs")
          text = path.read_text()

          text = text.replace(
              "use crate::app_storage::{ApplicationStorage, TrafficPeriod};\n",
              "use crate::app_storage::{ApplicationStorage, TrafficPeriod};\nuse crate::browser_ui::BrowserDiagnosticsPane;\n",
              1,
          )
          text = text.replace(
              ".with_min_inner_size([1120.0, 720.0])",
              ".with_min_inner_size([900.0, 680.0])",
              1,
          )
          text = text.replace(
              "    notice: Option<String>,\n}",
              "    notice: Option<String>,\n    browser_diagnostics: BrowserDiagnosticsPane,\n}",
              1,
          )
          text = text.replace(
              "        let now = Instant::now();\n        let mut app = Self {",
              "        let browser_database_path = settings.database_path.clone();\n        let now = Instant::now();\n        let mut app = Self {",
              1,
          )
          text = text.replace(
              "            notice: None,\n        };",
              "            notice: None,\n            browser_diagnostics: BrowserDiagnosticsPane::new(browser_database_path),\n        };",
              1,
          )

          old_default = '''                    self.database_path = product_data_dir()
                          .join("domainflow.db")
                          .to_string_lossy()
                          .to_string();
                      self.refresh_data(false);
                      self.save_settings();
          '''
          new_default = '''                    self.database_path = product_data_dir()
                          .join("domainflow.db")
                          .to_string_lossy()
                          .to_string();
                      self.browser_diagnostics
                          .set_database_path(PathBuf::from(self.database_path.trim()));
                      self.refresh_data(false);
                      self.save_settings();
          '''
          if old_default not in text:
              raise SystemExit("default database block not found")
          text = text.replace(old_default, new_default, 1)

          dashboard_start = text.index("    fn render_dashboard(&mut self")
          applications_start = text.index("    fn render_applications(&mut self", dashboard_start)
          dashboard = '''    fn render_dashboard(&mut self, ui: &mut egui::Ui, palette: Palette) {
              self.browser_diagnostics
                  .set_database_path(PathBuf::from(self.database_path.trim()));

              let app_coverage = percentage(
                  self.totals
                      .bytes
                      .saturating_sub(self.totals.unknown_application_bytes),
                  self.totals.bytes,
              );
              let domain_coverage = percentage(
                  self.totals
                      .bytes
                      .saturating_sub(self.totals.unknown_domain_bytes),
                  self.totals.bytes,
              );

              let available_width = ui.available_width();
              let metric_columns = responsive_metric_columns(available_width);
              let gap = 10.0;
              let metric_width = ((available_width - gap * (metric_columns as f32 - 1.0))
                  / metric_columns as f32)
                  .max(150.0);
              let metrics = [
                  ("本期总流量", format_bytes(self.totals.bytes), palette.blue),
                  (
                      "数据包",
                      format_integer(self.totals.packets),
                      palette.cyan,
                  ),
                  (
                      "应用归因率",
                      format!("{app_coverage:.1}%"),
                      palette.green,
                  ),
                  (
                      "域名识别率",
                      format!("{domain_coverage:.1}%"),
                      palette.amber,
                  ),
                  (
                      "实时写入",
                      format_rate(self.bytes_per_second),
                      palette.cyan,
                  ),
              ];
              egui::Grid::new("responsive-metrics")
                  .num_columns(metric_columns)
                  .spacing([gap, gap])
                  .show(ui, |ui| {
                      for (index, (title, value, color)) in metrics.iter().enumerate() {
                          metric_card(ui, title, value, *color, palette, metric_width);
                          if (index + 1) % metric_columns == 0 {
                              ui.end_row();
                          }
                      }
                  });

              ui.add_space(14.0);
              card(ui, palette, |ui| {
                  ui.horizontal_wrapped(|ui| {
                      ui.vertical(|ui| {
                          ui.heading(
                              egui::RichText::new(period_title(self.period))
                                  .strong()
                                  .color(palette.text),
                          );
                          ui.label(
                              egui::RichText::new("持久化 SQLite · 关闭程序后数据仍保留")
                                  .small()
                                  .color(palette.muted),
                          );
                      });
                      ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                          let search_width = ui.available_width().clamp(180.0, 340.0);
                          ui.add_sized(
                              [search_width, 32.0],
                              egui::TextEdit::singleline(&mut self.application_search)
                                  .hint_text("搜索应用，例如 edge、微信"),
                          );
                      });
                  });
              });

              ui.add_space(12.0);
              render_visibility_boundary(ui, palette);
              ui.add_space(12.0);

              if ui.available_width() >= 940.0 {
                  ui.columns(2, |columns| {
                      columns[0].set_min_width((ui.available_width() * 0.38).max(340.0));
                      self.render_applications(&mut columns[0], palette);
                      self.render_domains(&mut columns[1], palette);
                  });
              } else {
                  self.render_applications(ui, palette);
                  ui.add_space(12.0);
                  self.render_domains(ui, palette);
              }

              ui.add_space(14.0);
              self.browser_diagnostics.render(ui, self.theme, self.period);
          }

          '''
          text = text[:dashboard_start] + dashboard + text[applications_start:]
          text = text.replace(
              "选择应用后，右侧显示该应用的域名与方向细分。",
              "选择应用后，右侧显示该应用访问的域名；具体网页用途请继续查看下方浏览器活动诊断。",
              1,
          )

          domains_start = text.index("    fn render_domains(&self")
          impl_drop = text.index("\n}\n\nimpl Drop for DashboardApp", domains_start)
          domains = '''    fn render_domains(&self, ui: &mut egui::Ui, palette: Palette) {
              card(ui, palette, |ui| {
                  let app_title = self
                      .selected_application
                      .as_deref()
                      .map(display_application)
                      .unwrap_or_else(|| "全部应用".to_string());
                  ui.heading(
                      egui::RichText::new(format!("{app_title} · 访问域名"))
                          .strong()
                          .color(palette.text),
                  );
                  ui.label(
                      egui::RichText::new(
                          "这里保留域名总量与数据包排行。要判断大流量具体用于下载、视频、接口或脚本，请在下方输入该域名。",
                      )
                      .small()
                      .color(palette.muted),
                  );
                  ui.add_space(10.0);

                  if self.domains.is_empty() {
                      empty_state(ui, palette);
                      return;
                  }

                  let max_bytes = self.domains.first().map_or(1, |row| row.bytes.max(1));
                  egui::ScrollArea::vertical()
                      .id_salt("domains-scroll")
                      .auto_shrink([false, false])
                      .show(ui, |ui| {
                          for row in &self.domains {
                              domain_total_card(ui, row, max_bytes, palette);
                              ui.add_space(8.0);
                          }
                      });
              });
          }
          '''
          text = text[:domains_start] + domains + text[impl_drop:]

          text = text.replace(
              "Windows 应用、域名与流量方向仪表盘",
              "Windows 应用、域名与浏览器活动诊断仪表盘",
              1,
          )
          text = text.replace(
              '''        egui::SidePanel::left("controls")
                      .resizable(false)
                      .exact_width(350.0)
          ''',
              '''        egui::SidePanel::left("controls")
                      .resizable(true)
                      .default_width(330.0)
                      .min_width(280.0)
                      .max_width(420.0)
          ''',
              1,
          )

          metric_start = text.index("fn metric_card(")
          period_start = text.index("fn period_selector", metric_start)
          metric = '''fn metric_card(
              ui: &mut egui::Ui,
              title: &str,
              value: &str,
              accent: egui::Color32,
              palette: Palette,
              width: f32,
          ) {
              egui::Frame::default()
                  .fill(palette.card)
                  .stroke(egui::Stroke::new(1.0, palette.border))
                  .corner_radius(11)
                  .inner_margin(egui::Margin::symmetric(15, 12))
                  .show(ui, |ui| {
                      ui.set_min_width(width);
                      ui.set_max_width(width);
                      ui.label(egui::RichText::new(title).small().color(palette.muted));
                      ui.label(egui::RichText::new(value).size(22.0).strong().color(accent));
                  });
          }

          fn responsive_metric_columns(width: f32) -> usize {
              if width >= 1180.0 {
                  5
              } else if width >= 760.0 {
                  3
              } else {
                  2
              }
          }

          '''
          text = text[:metric_start] + metric + text[period_start:]

          domain_card_start = text.index("fn domain_detail_card(")
          detail_chip_start = text.index("fn detail_chip", domain_card_start)
          domain_card = '''fn domain_total_card(
              ui: &mut egui::Ui,
              row: &TopDomainDetailRow,
              max_bytes: u64,
              palette: Palette,
          ) {
              let accent = if row.domain == UNKNOWN_DOMAIN {
                  palette.amber
              } else {
                  palette.blue
              };
              egui::Frame::default()
                  .fill(palette.input)
                  .stroke(egui::Stroke::new(1.0, palette.border))
                  .corner_radius(9)
                  .inner_margin(egui::Margin::symmetric(13, 11))
                  .show(ui, |ui| {
                      let label = display_domain(&row.domain);
                      ui.horizontal(|ui| {
                          ui.label(
                              egui::RichText::new(shorten_text(&label, 48))
                                  .strong()
                                  .color(palette.text),
                          )
                          .on_hover_text(&label);
                          ui.with_layout(egui::Layout::right_to_left(egui::Align::Center), |ui| {
                              ui.label(
                                  egui::RichText::new(format_bytes(row.bytes))
                                      .strong()
                                      .color(accent),
                              );
                          });
                      });
                      let ratio = row.bytes as f32 / max_bytes.max(1) as f32;
                      ui.add(
                          egui::ProgressBar::new(ratio.clamp(0.0, 1.0))
                              .desired_width(ui.available_width())
                              .fill(accent),
                      );
                      ui.label(
                          egui::RichText::new(format!(
                              "{} 个数据包",
                              format_integer(row.packets)
                          ))
                          .small()
                          .color(palette.muted),
                      );
                  });
          }

          '''
          text = text[:domain_card_start] + domain_card + text[detail_chip_start:]

          detail_chip_start = text.index("fn detail_chip")
          boundary_start = text.index("fn render_visibility_boundary", detail_chip_start)
          text = text[:detail_chip_start] + text[boundary_start:]

          boundary_start = text.index("fn render_visibility_boundary")
          empty_start = text.index("fn empty_state", boundary_start)
          boundary = '''fn render_visibility_boundary(ui: &mut egui::Ui, palette: Palette) {
              card(ui, palette, |ui| {
                  ui.label(
                      egui::RichText::new("从“流量多少”继续追到“网页在做什么”")
                          .strong()
                          .color(palette.text),
                  );
                  ui.label(
                      egui::RichText::new(
                          "域名总量本身无法说明业务用途。v0.5 通过可选浏览器扩展补充请求 URL、资源类型、MIME、来源页面，以及真实下载文件名和大小。",
                      )
                      .color(palette.blue),
                  );
                  ui.separator();
                  ui.label(
                      egui::RichText::new(
                          "HTTPS 正文仍保持加密；工具不安装中间人证书、不读取消息正文或文件内容。",
                      )
                      .color(palette.muted),
                  );
              });
          }

          '''
          text = text[:boundary_start] + boundary + text[empty_start:]

          text = text.replace("    use crate::model::TrafficBreakdown;\n", "", 1)
          test_start = text.find("    #[test]\n    fn detail_percentage_is_stable()")
          if test_start != -1:
              next_test = text.index("    #[test]\n    fn long_text_is_shortened()", test_start)
              text = text[:test_start] + text[next_test:]

          test_marker = '''    #[test]
              fn long_text_is_shortened() {
          '''
          responsive_test = '''    #[test]
              fn metric_columns_follow_window_width() {
                  assert_eq!(responsive_metric_columns(1300.0), 5);
                  assert_eq!(responsive_metric_columns(900.0), 3);
                  assert_eq!(responsive_metric_columns(600.0), 2);
              }

              #[test]
              fn long_text_is_shortened() {
          '''
          if test_marker not in text:
              raise SystemExit("GUI test marker not found")
          text = text.replace(test_marker, responsive_test, 1)

          path.write_text(text)
          PY
          cargo fmt
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
      - name: Commit GUI wiring and lockfile
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src/gui.rs
          git commit -m "wire responsive dashboard and browser diagnostics"
          git push
