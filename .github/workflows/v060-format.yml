name: v060-format

on:
  push:
    branches:
      - agent/v060-reliability-e2e

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v060-reliability-e2e
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt
      - name: Commit formatter output
        shell: bash
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "format v0.6 Rust sources"
            git pull --rebase origin agent/v060-reliability-e2e
            git push origin HEAD:agent/v060-reliability-e2e
          fi
