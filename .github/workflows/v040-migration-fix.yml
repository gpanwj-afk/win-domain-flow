name: v040-migration-fix

on:
  push:
    branches:
      - agent/v040-theme-traffic-details
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v040-theme-traffic-details
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpcap-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fix v0.3 to v0.4 migration and add regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app_storage.rs")
          text = path.read_text()
          old = '''    if current.as_deref() == Some(APP_SCHEMA_VERSION) {
              return Ok(());
          }

          let tx = conn.transaction()?;
          tx.execute(
              "INSERT INTO application_domain_daily (
                  day_start_utc, application, domain, bytes, packets, updated_at_utc
               )
               SELECT day_start_utc, ?1, domain, bytes, packets, updated_at_utc
               FROM domain_daily
               WHERE true
               ON CONFLICT(day_start_utc, application, domain) DO NOTHING",
              [HISTORICAL_APPLICATION],
          )?;
          tx.execute(
          '''
          new = '''    if current.as_deref() == Some(APP_SCHEMA_VERSION) {
              return Ok(());
          }

          let should_import_legacy_totals = current.is_none();
          let tx = conn.transaction()?;
          if should_import_legacy_totals {
              tx.execute(
                  "INSERT INTO application_domain_daily (
                      day_start_utc, application, domain, bytes, packets, updated_at_utc
                   )
                   SELECT day_start_utc, ?1, domain, bytes, packets, updated_at_utc
                   FROM domain_daily
                   WHERE true
                   ON CONFLICT(day_start_utc, application, domain) DO NOTHING",
                  [HISTORICAL_APPLICATION],
              )?;
          }
          tx.execute(
          '''
          if old not in text:
              raise SystemExit("migration block not found")
          text = text.replace(old, new, 1)

          marker = '''    #[test]
          fn application_rows_and_details_are_additive_and_queryable() {
          '''
          test = '''    #[test]
          fn v03_upgrade_does_not_reimport_domain_totals() {
              let path = temp_db_path("v03_upgrade");
              let mut domain_storage = Storage::open(&path).unwrap();
              domain_storage
                  .upsert_batch(&FlushBatch {
                      rows: vec![DomainDelta {
                          day_start_utc: 86_400,
                          domain: "example.com".to_string(),
                          counters: Counters {
                              bytes: 100,
                              packets: 1,
                          },
                      }],
                  })
                  .unwrap();
              drop(domain_storage);

              let conn = Connection::open(&path).unwrap();
              conn.execute_batch(APP_SCHEMA_SQL).unwrap();
              conn.execute(
                  "INSERT INTO application_domain_daily (
                      day_start_utc, application, domain, bytes, packets, updated_at_utc
                   ) VALUES (?1, ?2, ?3, ?4, ?5, ?6)",
                  params![86_400_i64, "chrome.exe", "example.com", 100_i64, 1_i64, 0_i64],
              )
              .unwrap();
              conn.execute(
                  "INSERT INTO schema_meta (key, value) VALUES (?1, ?2)
                   ON CONFLICT(key) DO UPDATE SET value = excluded.value",
                  params![APP_SCHEMA_META_KEY, "1"],
              )
              .unwrap();
              drop(conn);

              let storage = ApplicationStorage::open(&path).unwrap();
              let apps = storage.top_applications(TrafficPeriod::All, 10).unwrap();
              assert_eq!(apps.len(), 1);
              assert_eq!(apps[0].application, "chrome.exe");
              assert_eq!(apps[0].bytes, 100);
              assert_eq!(storage.totals(TrafficPeriod::All).unwrap().bytes, 100);
              cleanup(&path);
          }

          #[test]
          fn application_rows_and_details_are_additive_and_queryable() {
          '''
          if marker not in text:
              raise SystemExit("test insertion marker not found")
          path.write_text(text.replace(marker, test, 1))
          PY
          cargo fmt
          cargo check --all-targets --locked
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --release --locked
      - name: Commit migration fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_storage.rs
          git commit -m "prevent duplicate totals during v0.3 migration"
          git push
