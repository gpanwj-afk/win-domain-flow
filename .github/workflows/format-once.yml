name: format-once

on:
  push:
    branches:
      - agent/stable-v0.6.1-clean

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust 1.88.0 with rustfmt
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt

      - name: Commit formatted Rust sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.rs'; then
            echo "Rust sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt [rustfmt]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
