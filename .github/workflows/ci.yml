name: ci

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMP CDP REPAIR
  repair-cdp:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v060-reliability-e2e' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/v060-reliability-e2e
      - name: Patch validator and remove repair scaffolding
        shell: python
        run: |
          from pathlib import Path
          validator = Path("tools/validate-windows.ps1")
          text = validator.read_text(encoding="utf-8")
          def replace_once(old, new, label):
              global text
              if new in text: return
              if old not in text: raise SystemExit(f"{label}: expected source block not found")
              text = text.replace(old, new, 1)
          replace_once("$BrowserSocket = $null\n$ServiceSession = $null", "$BrowserSocket = $null\n$ExtensionSocket = $null\n$ServiceSession = $null", "extension socket declaration")
          marker = "function Get-OwnedBrowserProcesses {\n"
          helper = '''function Find-CdpTargetDebuggerUrl {
              param([int]$Port, [string]$TargetId, [int]$TimeoutSeconds)
              $deadline = [DateTime]::UtcNow.AddSeconds($TimeoutSeconds)
              while ([DateTime]::UtcNow -lt $deadline) {
                  foreach ($path in @("/json/list", "/json")) {
                      try {
                          $targets = @(Invoke-RestMethod -Uri "http://127.0.0.1:$Port$path" -TimeoutSec 3)
                          $match = @($targets | Where-Object {
                              ([string]$_.id -eq $TargetId -or [string]$_.targetId -eq $TargetId) -and
                              -not [string]::IsNullOrWhiteSpace([string]$_.webSocketDebuggerUrl)
                          })
                          if ($match.Count -gt 0) { return [string]$match[0].webSocketDebuggerUrl }
                      } catch { }
                  }
                  Start-Sleep -Milliseconds 200
              }
              return $null
          }

          function Get-OwnedBrowserProcesses {
          '''
          if "function Find-CdpTargetDebuggerUrl" not in text:
              if marker not in text: raise SystemExit("debugger URL helper marker not found")
              text = text.replace(marker, helper, 1)
          old = '''    $attach = Send-Cdp $BrowserSocket "Target.attachToTarget" @{ targetId = $extensionTarget.target.targetId; flatten = $true }
              $ServiceSession = [string]$attach.sessionId
              $previous = Evaluate-Cdp $BrowserSocket $ServiceSession "new Promise(resolve => chrome.storage.local.get({diagnosticsEnabled:false, receiverPort:38765}).then(resolve))"
              $PreviousDiagnosticsEnabled = [bool]$previous.diagnosticsEnabled
              $setExpression = "new Promise((resolve,reject)=>chrome.storage.local.set({diagnosticsEnabled:true,receiverPort:$ReceiverPort}).then(()=>resolve(true)).catch(e=>reject(String(e))))"
              [void](Evaluate-Cdp $BrowserSocket $ServiceSession $setExpression)
              Add-Result "Extension diagnostics enabled" "PASS" "receiverPort=$ReceiverPort"
          '''
          new = '''    $serviceDebuggerUrl = Find-CdpTargetDebuggerUrl $BrowserDebugPort ([string]$extensionTarget.target.targetId) 15
              Assert-Evidence (-not [string]::IsNullOrWhiteSpace($serviceDebuggerUrl)) "Extension Service Worker debugger URL" ([string]$extensionTarget.target.targetId)
              $ExtensionSocket = Connect-Cdp $serviceDebuggerUrl
              [void](Send-Cdp $ExtensionSocket "Runtime.enable" @{})
              $runtimeProbe = Evaluate-Cdp $ExtensionSocket "" "({hasChrome:typeof chrome==='object',hasStorage:typeof chrome==='object' && !!chrome.storage && !!chrome.storage.local})"
              Assert-Evidence ([bool]$runtimeProbe.hasChrome -and [bool]$runtimeProbe.hasStorage) "Extension Runtime context" ($runtimeProbe | ConvertTo-Json -Compress)
              $previous = Evaluate-Cdp $ExtensionSocket "" "new Promise(resolve => chrome.storage.local.get({diagnosticsEnabled:false, receiverPort:38765}).then(resolve))"
              $PreviousDiagnosticsEnabled = [bool]$previous.diagnosticsEnabled
              $setExpression = "new Promise((resolve,reject)=>chrome.storage.local.set({diagnosticsEnabled:true,receiverPort:$ReceiverPort}).then(()=>resolve(true)).catch(e=>reject(String(e))))"
              [void](Evaluate-Cdp $ExtensionSocket "" $setExpression)
              Add-Result "Extension diagnostics enabled" "PASS" "receiverPort=$ReceiverPort"
          '''
          replace_once(old, new, "service worker CDP control")
          text = text.replace('Evaluate-Cdp $BrowserSocket $ServiceSession', 'Evaluate-Cdp $ExtensionSocket ""')
          replace_once('    if ($null -ne $BrowserSocket -and -not [string]::IsNullOrWhiteSpace($ServiceSession)) {\n', '    if ($null -ne $ExtensionSocket) {\n', "extension restore guard")
          for needle in ["Find-CdpTargetDebuggerUrl", "Extension Service Worker debugger URL", "Extension Runtime context", 'Evaluate-Cdp $ExtensionSocket ""']:
              if needle not in text: raise SystemExit(f"patched validator missing {needle}")
          validator.write_text(text, encoding="utf-8")
          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text(encoding="utf-8")
          begin = "  # BEGIN TEMP CDP REPAIR\n"; end = "  # END TEMP CDP REPAIR\n\n"
          start = ci_text.find(begin); finish = ci_text.find(end)
          if start < 0 or finish < 0 or finish < start: raise SystemExit("temporary repair markers not found in CI")
          ci.write_text(ci_text[:start] + ci_text[finish + len(end):], encoding="utf-8")
          temporary = Path(".github/workflows/repair-v060-cdp.yml")
          if temporary.exists(): temporary.unlink()
      - name: Commit repaired clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git add tools/validate-windows.ps1 .github/workflows/ci.yml .github/workflows/repair-v060-cdp.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden Service Worker CDP validation"
          git push origin HEAD:agent/v060-reliability-e2e
  # END TEMP CDP REPAIR

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install --yes libpcap-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@1.88.0
        with: {components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
      - name: Validate browser extension identity, syntax, and privacy policy
        shell: bash
        run: |
          node --check browser-extension/service_worker.js
          node --check browser-extension/popup.js
          python3 -m py_compile tools/browser_fixture.py tools/query_e2e_db.py
          python3 - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path
          manifest=json.loads(Path('browser-extension/manifest.json').read_text()); permissions=set(manifest.get('permissions',[])); hosts=manifest.get('host_permissions',[]); worker=Path('browser-extension/service_worker.js').read_text(); rust=Path('src/browser_activity.rs').read_text()
          assert manifest.get('manifest_version')==3 and manifest.get('version')=='0.6.0'
          for p in {'alarms','debugger','downloads','storage','tabs'}: assert p in permissions
          assert 'webRequest' not in permissions and '<all_urls>' not in hosts and hosts==['http://127.0.0.1/*'] and manifest.get('action',{}).get('default_popup')=='popup.html'
          public_key=base64.b64decode(manifest['key'],validate=True); digest=hashlib.sha256(public_key).digest()[:16]; derived=''.join(chr(97+(b>>4))+chr(97+(b&15)) for b in digest); m=re.search(r'BROWSER_EXTENSION_ID:\s*&str\s*=\s*"([a-p]{32})"',rust); assert m and derived==m.group(1)
          for needle in ['pendingEventQueue','RETRY_BASE_MS','RETRY_MAX_MS','MAX_QUEUE_BYTES','response.json()','accepted !== true','reportChain','revision','redirectResponse','transferredBytes: null','Network.dataReceived','Network.loadingFinished']: assert needle in worker
          assert 'Network.getResponseBody' not in worker
          PY
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - run: test -f target/release/win-domain-flow && test -f target/release/win-domain-flow-gui && test -f target/release/win-domain-flow-browser-receiver

  windows-product:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with: {targets: x86_64-pc-windows-msvc, components: clippy}
      - uses: Swatinem/rust-cache@v2
      - name: Install Npcap SDK 1.16
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $archive=Join-Path $env:RUNNER_TEMP 'npcap-sdk.zip'; $root=Join-Path $env:RUNNER_TEMP 'npcap-sdk'; $url='https://npcap.com/dist/npcap-sdk-1.16.zip'; Remove-Item $archive,$root -Recurse -Force -ErrorAction SilentlyContinue; $ok=$false
          for($a=1;$a-le 4;$a++){ & curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 --output $archive $url; if($LASTEXITCODE-eq 0 -and (Test-Path $archive) -and (Get-Item $archive).Length-gt 100000){$ok=$true;break}; Start-Sleep -Seconds (5*$a) }; if(-not $ok){throw 'Npcap SDK download failed'}
          Expand-Archive $archive $root -Force; $lib=Get-ChildItem $root -Recurse -Filter wpcap.lib|Where-Object{$_.FullName-match'(?i)(x64|amd64)'}|Select-Object -First 1; $hdr=Get-ChildItem $root -Recurse -Filter pcap.h|Select-Object -First 1; if(-not $lib -or -not $hdr){throw 'Npcap SDK files missing'}; "LIB=$($lib.DirectoryName);$env:LIB"|Out-File $env:GITHUB_ENV -Append; "INCLUDE=$($hdr.DirectoryName);$env:INCLUDE"|Out-File $env:GITHUB_ENV -Append
      - run: cargo check --all-targets --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify Windows executables
        shell: pwsh
        run: |
          $r='target\x86_64-pc-windows-msvc\release'; foreach($n in @('win-domain-flow.exe','win-domain-flow-gui.exe','win-domain-flow-browser-receiver.exe')){if(!(Test-Path "$r\$n")){throw "$n missing"}}
      - name: Validate PowerShell harness syntax
        shell: pwsh
        run: |
          $t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools\validate-windows.ps1),[ref]$t,[ref]$e)|Out-Null;if($e.Count-gt 0){$e|%{Write-Host $_.Message};throw 'PowerShell validation harness contains syntax errors'}
      - name: Install Chrome for Testing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$m=Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json' -TimeoutSec 30;$s=$m.channels.Stable;$d=@($s.downloads.chrome|?{$_.platform-eq'win64'})[0];$z=Join-Path $env:RUNNER_TEMP 'cft.zip';$x=Join-Path $env:RUNNER_TEMP 'cft';$p=Join-Path $env:ProgramFiles 'DomainFlow-CfT-ProgramFiles';$td=Join-Path $p 'Google\Chrome\Application';Remove-Item $z,$x,$p -Recurse -Force -ErrorAction SilentlyContinue;$ok=$false
          for($a=1;$a-le 4;$a++){& curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 300 --output $z $d.url;if($LASTEXITCODE-eq 0 -and (Test-Path $z) -and (Get-Item $z).Length-gt 10000000){$ok=$true;break};Start-Sleep -Seconds (5*$a)};if(-not $ok){throw 'Chrome for Testing download failed'};Expand-Archive $z $x -Force;$c=Get-ChildItem $x -Recurse -Filter chrome.exe|Select-Object -First 1;New-Item -ItemType Directory -Path $td -Force|Out-Null;Copy-Item (Join-Path $c.DirectoryName '*') $td -Recurse -Force;$chrome=Join-Path $td 'chrome.exe';& icacls.exe $p /grant '*S-1-15-2-1:(OI)(CI)RX' /T /C|Out-Host;if($LASTEXITCODE-ne 0){throw 'ACL grant failed'};& icacls.exe $p /grant '*S-1-15-2-2:(OI)(CI)RX' /T /C|Out-Host;if($LASTEXITCODE-ne 0){throw 'ACL grant failed'};"DOMAINFLOW_BROWSER_EXECUTABLE=$chrome"|Out-File $env:GITHUB_ENV -Append;"DOMAINFLOW_CFT_VERSION=$($s.version)"|Out-File $env:GITHUB_ENV -Append
      - name: Isolated Chrome for Testing browser diagnostics E2E
        timeout-minutes: 6
        shell: pwsh
        run: .\tools\validate-windows.ps1 -BinaryRoot '.\target\x86_64-pc-windows-msvc\release' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'domainflow-browser-e2e') -CiMode
      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with: {name: win-domain-flow-browser-e2e-evidence, if-no-files-found: warn, retention-days: 14, path: "${{ runner.temp }}/domainflow-browser-e2e/**"}
      - name: Assemble Windows package
        shell: pwsh
        run: |
          $source='target\x86_64-pc-windows-msvc\release';$package='dist\win-domain-flow-windows-x64';Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Path $package -Force|Out-Null;Copy-Item "$source\win-domain-flow.exe","$source\win-domain-flow-gui.exe","$source\win-domain-flow-browser-receiver.exe" $package;Copy-Item README.md,INSTALL.md,INSTALL_CN.md $package;Copy-Item browser-extension "$package\browser-extension" -Recurse;New-Item -ItemType Directory -Path "$package\tools" -Force|Out-Null;Copy-Item tools\validate-windows.ps1,tools\browser_fixture.py,tools\query_e2e_db.py "$package\tools"
          '@echo off`r`npowershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath ''%~dp0win-domain-flow-gui.exe'' -WorkingDirectory ''%~dp0'' -Verb RunAs"'|Set-Content "$package\Start-GUI-As-Administrator.cmd" -Encoding Ascii
          $req=@('win-domain-flow.exe','win-domain-flow-gui.exe','win-domain-flow-browser-receiver.exe','README.md','INSTALL.md','INSTALL_CN.md','Start-GUI-As-Administrator.cmd','browser-extension\manifest.json','browser-extension\service_worker.js','browser-extension\popup.html','browser-extension\popup.js','browser-extension\README_CN.md','tools\validate-windows.ps1','tools\browser_fixture.py','tools\query_e2e_db.py');foreach($r in $req){if(!(Test-Path(Join-Path $package $r))){throw "Package item missing: $r"}};$bad=@(Get-ChildItem $package -Recurse -Force|?{$_.Name-match'(?i)\.(pem|key|pfx|p12|db)$' -or $_.Name-match'(?i)(\.db-wal|\.db-shm|validation-report|validation-manifest|edge-profile)'});if($bad.Count-gt 0){throw 'Release package contains private, runtime, or validation-only files'}
      - uses: actions/upload-artifact@v7
        with: {name: win-domain-flow-windows-x64, if-no-files-found: error, retention-days: 14, path: "dist/win-domain-flow-windows-x64/**"}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [linux-quality, windows-product]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: {name: win-domain-flow-windows-x64, path: dist/win-domain-flow-windows-x64}
      - id: release_meta
        shell: bash
        run: |
          set -euo pipefail;version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml|head -n1)";tag="v$version";archive="win-domain-flow-${tag}-windows-x64.zip";(cd dist&&zip -q -r "../$archive" win-domain-flow-windows-x64);sha256sum "$archive">"$archive.sha256";printf '## win-domain-flow %s\n\nStable Windows x64 release built from `%s` after Linux, Windows, isolated browser E2E, Receiver replay, and package-content gates.\n' "$tag" "$GITHUB_SHA">RELEASE_NOTES.md;echo "tag=$tag">>$GITHUB_OUTPUT;echo "archive=$archive">>$GITHUB_OUTPUT
      - shell: bash
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.release_meta.outputs.tag }}", ARCHIVE: "${{ steps.release_meta.outputs.archive }}"}
        run: |
          set -euo pipefail;if gh release view "$TAG">/dev/null 2>&1;then echo "Release $TAG already exists; refusing to overwrite.";exit 0;fi;gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --target "$GITHUB_SHA" --title "win-domain-flow $TAG" --notes-file RELEASE_NOTES.md --latest
