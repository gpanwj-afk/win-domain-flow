name: ci

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  repair-popup-session-e2e:
    if: github.head_ref == 'agent/v060-reliability-e2e' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v060-reliability-e2e
      - name: Patch popup CDP control to flattened session
        shell: python
        run: |
          from pathlib import Path
          path=Path('tools/validate-windows.ps1')
          text=path.read_text(encoding='utf-8')
          old='''    $popupDebuggerUrl = Find-CdpTargetDebuggerUrl $BrowserDebugPort ([string]$popupTarget.targetId) 15
              Assert-Evidence (-not [string]::IsNullOrWhiteSpace($popupDebuggerUrl)) "Extension popup debugger URL" ([string]$popupTarget.targetId)
              $ExtensionSocket = Connect-Cdp $popupDebuggerUrl
              [void](Send-Cdp $ExtensionSocket "Runtime.enable" @{})
              $runtimeProbe = Evaluate-Cdp $ExtensionSocket "" "({hasChrome:typeof chrome==='object',hasRuntime:typeof chrome==='object' && !!chrome.runtime && !!chrome.runtime.sendMessage,hasStorage:typeof chrome==='object' && !!chrome.storage && !!chrome.storage.local})"
              Assert-Evidence ([bool]$runtimeProbe.hasChrome -and [bool]$runtimeProbe.hasRuntime -and [bool]$runtimeProbe.hasStorage) "Extension popup Runtime context" ($runtimeProbe | ConvertTo-Json -Compress)
              $previous = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:'diagnostics-health'})"
          '''
          new='''    $popupAttach = Send-Cdp $BrowserSocket "Target.attachToTarget" @{ targetId = [string]$popupTarget.targetId; flatten = $true }
              $ServiceSession = [string]$popupAttach.sessionId
              Assert-Evidence (-not [string]::IsNullOrWhiteSpace($ServiceSession)) "Extension popup CDP session" $ServiceSession
              [void](Send-Cdp $BrowserSocket "Runtime.enable" @{} $ServiceSession)
              $runtimeProbe = Evaluate-Cdp $BrowserSocket $ServiceSession "({hasChrome:typeof chrome==='object',hasRuntime:typeof chrome==='object' && !!chrome.runtime && !!chrome.runtime.sendMessage,hasStorage:typeof chrome==='object' && !!chrome.storage && !!chrome.storage.local})"
              Assert-Evidence ([bool]$runtimeProbe.hasChrome -and [bool]$runtimeProbe.hasRuntime -and [bool]$runtimeProbe.hasStorage) "Extension popup Runtime context" ($runtimeProbe | ConvertTo-Json -Compress)
              $previous = Evaluate-Cdp $BrowserSocket $ServiceSession "chrome.runtime.sendMessage({type:'diagnostics-health'})"
          '''
          if old not in text: raise SystemExit('popup debugger block not found')
          text=text.replace(old,new,1)
          text=text.replace('Evaluate-Cdp $ExtensionSocket ""', 'Evaluate-Cdp $BrowserSocket $ServiceSession')
          text=text.replace('    if ($null -ne $ExtensionSocket) {\n', '    if ($null -ne $BrowserSocket -and -not [string]::IsNullOrWhiteSpace($ServiceSession)) {\n', 1)
          for needle in ['Extension popup CDP session','Evaluate-Cdp $BrowserSocket $ServiceSession','Target.attachToTarget']:
              if needle not in text: raise SystemExit(f'missing patched marker: {needle}')
          if 'Extension popup debugger URL' in text: raise SystemExit('obsolete popup debugger URL gate remains')
          path.write_text(text,encoding='utf-8')
      - name: Commit validator patch
        shell: bash
        run: |
          set -euo pipefail
          git add tools/validate-windows.ps1
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Drive popup through flattened CDP session"
          git push origin HEAD:agent/v060-reliability-e2e
