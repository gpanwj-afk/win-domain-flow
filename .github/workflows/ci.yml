name: ci

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  repair-popup-e2e:
    if: github.head_ref == 'agent/v060-reliability-e2e' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v060-reliability-e2e
      - name: Patch validator to use extension popup public messaging API
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/validate-windows.ps1')
          text = path.read_text(encoding='utf-8')

          old = '''    $serviceDebuggerUrl = Find-CdpTargetDebuggerUrl $BrowserDebugPort ([string]$extensionTarget.target.targetId) 15
              Assert-Evidence (-not [string]::IsNullOrWhiteSpace($serviceDebuggerUrl)) "Extension Service Worker debugger URL" ([string]$extensionTarget.target.targetId)
              $ExtensionSocket = Connect-Cdp $serviceDebuggerUrl
              [void](Send-Cdp $ExtensionSocket "Runtime.enable" @{})
              $runtimeProbe = Evaluate-Cdp $ExtensionSocket "" "({hasChrome:typeof chrome==='object',hasStorage:typeof chrome==='object' && !!chrome.storage && !!chrome.storage.local})"
              Assert-Evidence ([bool]$runtimeProbe.hasChrome -and [bool]$runtimeProbe.hasStorage) "Extension Runtime context" ($runtimeProbe | ConvertTo-Json -Compress)
              $previous = Evaluate-Cdp $ExtensionSocket "" "new Promise(resolve => chrome.storage.local.get({diagnosticsEnabled:false, receiverPort:38765}).then(resolve))"
              $PreviousDiagnosticsEnabled = [bool]$previous.diagnosticsEnabled
              $setExpression = "new Promise((resolve,reject)=>chrome.storage.local.set({diagnosticsEnabled:true,receiverPort:$ReceiverPort}).then(()=>resolve(true)).catch(e=>reject(String(e))))"
              [void](Evaluate-Cdp $ExtensionSocket "" $setExpression)
              Add-Result "Extension diagnostics enabled" "PASS" "receiverPort=$ReceiverPort"
          '''
          new = '''    $extensionWorkerUrl = [string]$extensionTarget.target.url
              if ($extensionWorkerUrl -notmatch '^((?:chrome|edge)-extension://[a-p]{32})/') {
                  throw "Could not derive packaged extension origin from service worker URL: $extensionWorkerUrl"
              }
              $extensionOrigin = [string]$Matches[1]
              $popupTarget = Send-Cdp $BrowserSocket "Target.createTarget" @{ url = "$extensionOrigin/popup.html" }
              $OwnedTargets.Add([string]$popupTarget.targetId) | Out-Null
              $popupDebuggerUrl = Find-CdpTargetDebuggerUrl $BrowserDebugPort ([string]$popupTarget.targetId) 15
              Assert-Evidence (-not [string]::IsNullOrWhiteSpace($popupDebuggerUrl)) "Extension popup debugger URL" ([string]$popupTarget.targetId)
              $ExtensionSocket = Connect-Cdp $popupDebuggerUrl
              [void](Send-Cdp $ExtensionSocket "Runtime.enable" @{})
              $runtimeProbe = Evaluate-Cdp $ExtensionSocket "" "({hasChrome:typeof chrome==='object',hasRuntime:typeof chrome==='object' && !!chrome.runtime && !!chrome.runtime.sendMessage,hasStorage:typeof chrome==='object' && !!chrome.storage && !!chrome.storage.local})"
              Assert-Evidence ([bool]$runtimeProbe.hasChrome -and [bool]$runtimeProbe.hasRuntime -and [bool]$runtimeProbe.hasStorage) "Extension popup Runtime context" ($runtimeProbe | ConvertTo-Json -Compress)
              $previous = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:'diagnostics-health'})"
              Assert-Evidence ([bool]$previous.ok) "Extension popup Receiver health" ($previous | ConvertTo-Json -Compress)
              $PreviousDiagnosticsEnabled = [bool]$previous.enabled
              $portResponse = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:'diagnostics-set-receiver-port',port:$ReceiverPort})"
              Assert-Evidence ([bool]$portResponse.ok -and [int]$portResponse.receiverPort -eq $ReceiverPort) "Extension Receiver port configured" ($portResponse | ConvertTo-Json -Compress)
              $enableResponse = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:'diagnostics-set-enabled',enabled:true})"
              Assert-Evidence ([bool]$enableResponse.ok -and [bool]$enableResponse.enabled) "Extension diagnostics enabled" ($enableResponse | ConvertTo-Json -Compress)
          '''
          if old not in text:
              raise SystemExit('service worker debugger control block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '$extensionHealth = Evaluate-Cdp $ExtensionSocket "" "({enabled:diagnosticsEnabled,attachedTabs:attachedTabs.size,queueLength:eventQueue.length,lastAttachError,lastReceiverError})"',
              '$extensionHealth = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:\'diagnostics-health\'})"',
          )
          text = text.replace(
              '$outageHealth = Evaluate-Cdp $ExtensionSocket "" "({queueLength:eventQueue.length,lastReceiverError})"',
              '$outageHealth = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:\'diagnostics-health\'})"',
          )
          text = text.replace(
              '$recoveryHealth = Evaluate-Cdp $ExtensionSocket "" "({queueLength:eventQueue.length,lastReceiverError})"',
              '$recoveryHealth = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:\'diagnostics-health\'})"',
          )

          old_restore = '''            $restoreValue = if ($PreviousDiagnosticsEnabled) { "true" } else { "false" }
              [void](Evaluate-Cdp $ExtensionSocket "" "chrome.storage.local.set({diagnosticsEnabled:$restoreValue}).then(()=>true)")
              Add-Result "Extension diagnostics setting restored" "PASS" "diagnosticsEnabled=$restoreValue"
          '''
          new_restore = '''            $restoreValue = if ($PreviousDiagnosticsEnabled) { "true" } else { "false" }
              $restorePort = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:'diagnostics-set-receiver-port',port:38765})"
              $restoreEnabled = Evaluate-Cdp $ExtensionSocket "" "chrome.runtime.sendMessage({type:'diagnostics-set-enabled',enabled:$restoreValue})"
              if (-not [bool]$restorePort.ok -or -not [bool]$restoreEnabled.ok) { throw "Extension settings restore was rejected" }
              Add-Result "Extension diagnostics setting restored" "PASS" "diagnosticsEnabled=$restoreValue; receiverPort=38765"
          '''
          if old_restore not in text:
              raise SystemExit('extension restore block not found')
          text = text.replace(old_restore, new_restore, 1)

          required = [
              'Extension popup debugger URL',
              'Extension popup Runtime context',
              "chrome.runtime.sendMessage({type:'diagnostics-health'})",
              "diagnostics-set-receiver-port",
              "diagnostics-set-enabled",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'patched validator missing {needle}')
          if 'Extension Service Worker debugger URL' in text:
              raise SystemExit('obsolete service worker debugger gate still present')
          path.write_text(text, encoding='utf-8')
      - name: Commit validator patch
        shell: bash
        run: |
          set -euo pipefail
          git add tools/validate-windows.ps1
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate extension through popup messaging"
          git push origin HEAD:agent/v060-reliability-e2e
