name: ci

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMP CDP REPAIR
  repair-cdp:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v060-reliability-e2e' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v060-reliability-e2e
      - name: Patch validator
        shell: python
        run: |
          from pathlib import Path
          validator=Path('tools/validate-windows.ps1');text=validator.read_text(encoding='utf-8')
          def r(old,new,label):
              global text
              if new in text:return
              if old not in text:raise SystemExit(f'{label}: expected block not found')
              text=text.replace(old,new,1)
          r('$BrowserSocket = $null\n$ServiceSession = $null','$BrowserSocket = $null\n$ExtensionSocket = $null\n$ServiceSession = $null','socket declaration')
          marker='function Get-OwnedBrowserProcesses {\n'
          helper='''function Find-CdpTargetDebuggerUrl {
              param([int]$Port, [string]$TargetId, [int]$TimeoutSeconds)
              $deadline = [DateTime]::UtcNow.AddSeconds($TimeoutSeconds)
              while ([DateTime]::UtcNow -lt $deadline) {
                  foreach ($path in @("/json/list", "/json")) {
                      try {
                          $targets = @(Invoke-RestMethod -Uri "http://127.0.0.1:$Port$path" -TimeoutSec 3)
                          $match = @($targets | Where-Object { ([string]$_.id -eq $TargetId -or [string]$_.targetId -eq $TargetId) -and -not [string]::IsNullOrWhiteSpace([string]$_.webSocketDebuggerUrl) })
                          if ($match.Count -gt 0) { return [string]$match[0].webSocketDebuggerUrl }
                      } catch { }
                  }
                  Start-Sleep -Milliseconds 200
              }
              return $null
          }

          function Get-OwnedBrowserProcesses {
          '''
          if 'function Find-CdpTargetDebuggerUrl' not in text:
              if marker not in text:raise SystemExit('debugger helper marker missing')
              text=text.replace(marker,helper,1)
          old='''    $attach = Send-Cdp $BrowserSocket "Target.attachToTarget" @{ targetId = $extensionTarget.target.targetId; flatten = $true }
              $ServiceSession = [string]$attach.sessionId
              $previous = Evaluate-Cdp $BrowserSocket $ServiceSession "new Promise(resolve => chrome.storage.local.get({diagnosticsEnabled:false, receiverPort:38765}).then(resolve))"
              $PreviousDiagnosticsEnabled = [bool]$previous.diagnosticsEnabled
              $setExpression = "new Promise((resolve,reject)=>chrome.storage.local.set({diagnosticsEnabled:true,receiverPort:$ReceiverPort}).then(()=>resolve(true)).catch(e=>reject(String(e))))"
              [void](Evaluate-Cdp $BrowserSocket $ServiceSession $setExpression)
              Add-Result "Extension diagnostics enabled" "PASS" "receiverPort=$ReceiverPort"
          '''
          new='''    $serviceDebuggerUrl = Find-CdpTargetDebuggerUrl $BrowserDebugPort ([string]$extensionTarget.target.targetId) 15
              Assert-Evidence (-not [string]::IsNullOrWhiteSpace($serviceDebuggerUrl)) "Extension Service Worker debugger URL" ([string]$extensionTarget.target.targetId)
              $ExtensionSocket = Connect-Cdp $serviceDebuggerUrl
              [void](Send-Cdp $ExtensionSocket "Runtime.enable" @{})
              $runtimeProbe = Evaluate-Cdp $ExtensionSocket "" "({hasChrome:typeof chrome==='object',hasStorage:typeof chrome==='object' && !!chrome.storage && !!chrome.storage.local})"
              Assert-Evidence ([bool]$runtimeProbe.hasChrome -and [bool]$runtimeProbe.hasStorage) "Extension Runtime context" ($runtimeProbe | ConvertTo-Json -Compress)
              $previous = Evaluate-Cdp $ExtensionSocket "" "new Promise(resolve => chrome.storage.local.get({diagnosticsEnabled:false, receiverPort:38765}).then(resolve))"
              $PreviousDiagnosticsEnabled = [bool]$previous.diagnosticsEnabled
              $setExpression = "new Promise((resolve,reject)=>chrome.storage.local.set({diagnosticsEnabled:true,receiverPort:$ReceiverPort}).then(()=>resolve(true)).catch(e=>reject(String(e))))"
              [void](Evaluate-Cdp $ExtensionSocket "" $setExpression)
              Add-Result "Extension diagnostics enabled" "PASS" "receiverPort=$ReceiverPort"
          '''
          r(old,new,'service worker control')
          text=text.replace('Evaluate-Cdp $BrowserSocket $ServiceSession','Evaluate-Cdp $ExtensionSocket ""')
          r('    if ($null -ne $BrowserSocket -and -not [string]::IsNullOrWhiteSpace($ServiceSession)) {\n','    if ($null -ne $ExtensionSocket) {\n','restore guard')
          validator.write_text(text,encoding='utf-8')
      - name: Commit validator repair only
        shell: bash
        run: |
          set -euo pipefail
          git add tools/validate-windows.ps1
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden Service Worker CDP validation"
          git push origin HEAD:agent/v060-reliability-e2e
  # END TEMP CDP REPAIR

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install --yes libpcap-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@1.88.0
        with: {components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
      - name: Validate browser extension identity, syntax, and privacy policy
        shell: bash
        run: |
          node --check browser-extension/service_worker.js
          node --check browser-extension/popup.js
          python3 -m py_compile tools/browser_fixture.py tools/query_e2e_db.py
          python3 - <<'PY'
          import base64,hashlib,json,re
          from pathlib import Path
          m=json.loads(Path('browser-extension/manifest.json').read_text());p=set(m.get('permissions',[]));h=m.get('host_permissions',[]);w=Path('browser-extension/service_worker.js').read_text();r=Path('src/browser_activity.rs').read_text();assert m.get('manifest_version')==3 and m.get('version')=='0.6.0';[(_ for _ in ()).throw(AssertionError(x)) for x in {'alarms','debugger','downloads','storage','tabs'} if x not in p];assert 'webRequest' not in p and '<all_urls>' not in h and h==['http://127.0.0.1/*'];k=base64.b64decode(m['key'],validate=True);d=hashlib.sha256(k).digest()[:16];i=''.join(chr(97+(b>>4))+chr(97+(b&15)) for b in d);x=re.search(r'BROWSER_EXTENSION_ID:\s*&str\s*=\s*"([a-p]{32})"',r);assert x and i==x.group(1);[(_ for _ in ()).throw(AssertionError(n)) for n in ['pendingEventQueue','RETRY_BASE_MS','RETRY_MAX_MS','MAX_QUEUE_BYTES','response.json()','accepted !== true','reportChain','revision','redirectResponse','transferredBytes: null','Network.dataReceived','Network.loadingFinished'] if n not in w];assert 'Network.getResponseBody' not in w
          PY
      - run: cargo fmt --check
      - run: cargo check --all-targets --locked
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - run: test -f target/release/win-domain-flow && test -f target/release/win-domain-flow-gui && test -f target/release/win-domain-flow-browser-receiver

  windows-product:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with: {targets: x86_64-pc-windows-msvc, components: clippy}
      - uses: Swatinem/rust-cache@v2
      - name: Install Npcap SDK 1.16
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$z=Join-Path $env:RUNNER_TEMP 'npcap.zip';$r=Join-Path $env:RUNNER_TEMP 'npcap';$u='https://npcap.com/dist/npcap-sdk-1.16.zip';$ok=$false;for($a=1;$a-le 4;$a++){& curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 --output $z $u;if($LASTEXITCODE-eq 0 -and(Test-Path $z)-and(Get-Item $z).Length-gt 100000){$ok=$true;break}};if(-not $ok){throw 'Npcap SDK download failed'};Expand-Archive $z $r -Force;$l=Get-ChildItem $r -Recurse -Filter wpcap.lib|?{$_.FullName-match'(?i)(x64|amd64)'}|select -First 1;$h=Get-ChildItem $r -Recurse -Filter pcap.h|select -First 1;"LIB=$($l.DirectoryName);$env:LIB"|Out-File $env:GITHUB_ENV -Append;"INCLUDE=$($h.DirectoryName);$env:INCLUDE"|Out-File $env:GITHUB_ENV -Append
      - run: cargo check --all-targets --locked --target x86_64-pc-windows-msvc
      - run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify Windows executables
        shell: pwsh
        run: $r='target\x86_64-pc-windows-msvc\release';foreach($n in @('win-domain-flow.exe','win-domain-flow-gui.exe','win-domain-flow-browser-receiver.exe')){if(!(Test-Path "$r\$n")){throw "$n missing"}}
      - name: Validate PowerShell harness syntax
        shell: pwsh
        run: $t=$null;$e=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools\validate-windows.ps1),[ref]$t,[ref]$e)|Out-Null;if($e.Count-gt 0){throw 'PowerShell validation harness contains syntax errors'}
      - name: Install Chrome for Testing
        shell: pwsh
        run: |
          $m=Invoke-RestMethod 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json';$s=$m.channels.Stable;$d=@($s.downloads.chrome|?{$_.platform-eq'win64'})[0];$z=Join-Path $env:RUNNER_TEMP 'cft.zip';$x=Join-Path $env:RUNNER_TEMP 'cft';$p=Join-Path $env:ProgramFiles 'DomainFlow-CfT-ProgramFiles';$td=Join-Path $p 'Google\Chrome\Application';& curl.exe --fail --location --retry 5 --retry-all-errors --output $z $d.url;Expand-Archive $z $x -Force;$c=Get-ChildItem $x -Recurse -Filter chrome.exe|select -First 1;New-Item -ItemType Directory -Path $td -Force|Out-Null;Copy-Item (Join-Path $c.DirectoryName '*') $td -Recurse -Force;& icacls.exe $p /grant '*S-1-15-2-1:(OI)(CI)RX' /T /C|Out-Null;& icacls.exe $p /grant '*S-1-15-2-2:(OI)(CI)RX' /T /C|Out-Null;"DOMAINFLOW_BROWSER_EXECUTABLE=$(Join-Path $td 'chrome.exe')"|Out-File $env:GITHUB_ENV -Append
      - name: Isolated Chrome for Testing browser diagnostics E2E
        timeout-minutes: 6
        shell: pwsh
        run: .\tools\validate-windows.ps1 -BinaryRoot '.\target\x86_64-pc-windows-msvc\release' -OutputDirectory (Join-Path $env:RUNNER_TEMP 'domainflow-browser-e2e') -CiMode
      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with: {name: win-domain-flow-browser-e2e-evidence, path: "${{ runner.temp }}/domainflow-browser-e2e/**", if-no-files-found: warn, retention-days: 14}
      - name: Assemble Windows package
        shell: pwsh
        run: |
          $s='target\x86_64-pc-windows-msvc\release';$p='dist\win-domain-flow-windows-x64';New-Item -ItemType Directory -Path $p -Force|Out-Null;Copy-Item "$s\win-domain-flow.exe","$s\win-domain-flow-gui.exe","$s\win-domain-flow-browser-receiver.exe" $p;Copy-Item README.md,INSTALL.md,INSTALL_CN.md $p;Copy-Item browser-extension "$p\browser-extension" -Recurse;New-Item -ItemType Directory -Path "$p\tools" -Force|Out-Null;Copy-Item tools\validate-windows.ps1,tools\browser_fixture.py,tools\query_e2e_db.py "$p\tools";'@echo off`r`npowershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath ''%~dp0win-domain-flow-gui.exe'' -WorkingDirectory ''%~dp0'' -Verb RunAs"'|Set-Content "$p\Start-GUI-As-Administrator.cmd" -Encoding Ascii;$bad=@(Get-ChildItem $p -Recurse -Force|?{$_.Name-match'(?i)\.(pem|key|pfx|p12|db)$' -or $_.Name-match'(?i)(\.db-wal|\.db-shm|validation-report|validation-manifest|edge-profile)'});if($bad.Count){throw 'forbidden package file'}
      - uses: actions/upload-artifact@v7
        with: {name: win-domain-flow-windows-x64, path: "dist/win-domain-flow-windows-x64/**", if-no-files-found: error, retention-days: 14}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [linux-quality, windows-product]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: {name: win-domain-flow-windows-x64, path: dist/win-domain-flow-windows-x64}
      - id: meta
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml|head -1);t=v$v;a=win-domain-flow-$t-windows-x64.zip;(cd dist&&zip -q -r ../$a win-domain-flow-windows-x64);sha256sum $a>$a.sha256;printf '## win-domain-flow %s\n\nStable Windows x64 release after full Linux, Windows and isolated browser E2E gates.\n' "$t">RELEASE_NOTES.md;echo tag=$t>>$GITHUB_OUTPUT;echo archive=$a>>$GITHUB_OUTPUT
      - shell: bash
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ steps.meta.outputs.tag }}", ARCHIVE: "${{ steps.meta.outputs.archive }}"}
        run: if gh release view "$TAG">/dev/null 2>&1;then exit 0;fi;gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --target "$GITHUB_SHA" --title "win-domain-flow $TAG" --notes-file RELEASE_NOTES.md --latest
