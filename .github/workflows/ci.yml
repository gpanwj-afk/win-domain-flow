name: master-release-diagnostic

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v060-reliability-e2e
      - name: Query master CI and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: 66c43af4a96857b2200af6a3f8d29eb518a382f5
        run: |
          set -euo pipefail
          matching_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MERGE_SHA}&event=push&per_page=100")"
          recent_master_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=master&event=push&per_page=10")"
          master_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master")"
          if release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.6.0" 2>/dev/null)"; then
            release_exists=true
          else
            release_exists=false
            release='null'
          fi
          jq -n \
            --arg merge_sha "$MERGE_SHA" \
            --argjson matching_runs "$matching_runs" \
            --argjson recent_master_runs "$recent_master_runs" \
            --argjson master_ref "$master_ref" \
            --argjson release_exists "$release_exists" \
            --argjson release "$release" \
            '{queried_merge_sha:$merge_sha,matching_runs:$matching_runs,recent_master_runs:$recent_master_runs,master_ref:$master_ref,release_exists:$release_exists,release:$release}' \
            > master-release-diagnostic.json
          cat master-release-diagnostic.json
      - name: Persist diagnostic JSON
        shell: bash
        run: |
          set -euo pipefail
          git add master-release-diagnostic.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record master release diagnostic"
          git push origin HEAD:agent/v060-reliability-e2e
