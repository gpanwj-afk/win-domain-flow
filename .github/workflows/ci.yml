name: ci

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  productize-source-fix:
    if: github.ref == 'refs/heads/agent/productize-cn-app-dashboard' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: agent/productize-cn-app-dashboard
      - name: Apply verified source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          storage = Path('src/app_storage.rs')
          text = storage.read_text()
          old = '''         FROM domain_daily
         ON CONFLICT(day_start_utc, application, domain) DO NOTHING'''
          new = '''         FROM domain_daily
         WHERE true
         ON CONFLICT(day_start_utc, application, domain) DO NOTHING'''
          if old not in text:
              raise SystemExit('historical migration SQL marker not found')
          text = text.replace(old, new, 1)
          old_collect = '''            let collected = mapped.collect::<Result<Vec<_>, _>>()?;
            collected'''
          if text.count(old_collect) != 2:
              raise SystemExit('expected two collected bindings')
          text = text.replace(old_collect, '            mapped.collect::<Result<Vec<_>, _>>()?')
          storage.write_text(text)

          attribution = Path('src/attribution.rs')
          text = attribution.read_text()
          create_block = '''    pub fn create() -> Box<dyn ProcessAttributor> {
        Box::new(WindowsProcessAttributor::default())
    }
'''
          if text.count(create_block) != 1:
              raise SystemExit('windows create block not found exactly once')
          text = text.replace(create_block, '', 1)
          marker = '    #[cfg(test)]\n    mod tests {'
          if marker not in text:
              raise SystemExit('windows tests marker not found')
          text = text.replace(marker, create_block + '\n' + marker, 1)
          text = text.replace(
              '        return windows_backend::create();',
              '        windows_backend::create()',
              1,
          )
          attribution.write_text(text)

          settings = Path('src/settings.rs')
          text = settings.read_text()
          old_settings = '        return std::env::var_os("LOCALAPPDATA").map(PathBuf::from);'
          if old_settings not in text:
              raise SystemExit('settings windows return not found')
          settings.write_text(
              text.replace(
                  old_settings,
                  '        std::env::var_os("LOCALAPPDATA").map(PathBuf::from)',
                  1,
              )
          )
          PY
          cargo fmt
          git diff --check
          grep -q "WHERE true" src/app_storage.rs
          ! grep -q "let collected = mapped.collect" src/app_storage.rs
      - name: Commit source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_storage.rs src/attribution.rs src/settings.rs
          git commit -m "fix product migration and lint findings"
          git push

  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpcap-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Test all targets
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Release build
        run: cargo build --release --locked

      - name: Verify release binaries
        run: |
          test -f target/release/win-domain-flow
          test -f target/release/win-domain-flow-gui

  windows-product:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88.0 MSVC
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Npcap SDK 1.16
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $root = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $root -Force

          $library = Get-ChildItem $root -Recurse -Filter wpcap.lib |
            Where-Object { $_.FullName -match "(?i)(x64|amd64)" } |
            Select-Object -First 1
          $header = Get-ChildItem $root -Recurse -Filter pcap.h | Select-Object -First 1
          if (-not $library) { throw "Npcap x64 wpcap.lib not found" }
          if (-not $header) { throw "Npcap pcap.h not found" }

          "LIB=$($library.DirectoryName);$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INCLUDE=$($header.DirectoryName);$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check Windows targets
        run: cargo check --all-targets --locked --target x86_64-pc-windows-msvc

      - name: Clippy Windows targets
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Release build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Verify Windows executables
        shell: pwsh
        run: |
          $root = "target\x86_64-pc-windows-msvc\release"
          if (!(Test-Path "$root\win-domain-flow.exe")) { throw "CLI executable missing" }
          if (!(Test-Path "$root\win-domain-flow-gui.exe")) { throw "GUI executable missing" }
