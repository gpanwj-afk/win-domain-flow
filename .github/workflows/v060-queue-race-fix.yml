name: v060-queue-race-fix

on:
  push:
    branches:
      - agent/v060-reliability-e2e
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v060-reliability-e2e
          fetch-depth: 0
      - name: Patch queue revision handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("browser-extension/service_worker.js")
          text = path.read_text()

          delivery = re.compile(
              r'(?P<i>\s*)try \{\n'
              r'(?P=i)  await deliverEvent\(entry\.payload\);\n'
              r'(?P=i)  eventQueue\.shift\(\);\n'
              r'(?P=i)  lastReceiverError = null;\n'
              r'(?P=i)  await persistQueue\(\);\n'
              r'(?P=i)\} catch \(error\) \{'
          )
          match = delivery.search(text)
          if not match:
              raise SystemExit("queue delivery marker not found")
          i = match.group('i')
          replacement = (
              f"{i}const revision = Number(entry.revision) || 0;\n"
              f"{i}const payload = entry.payload;\n"
              f"{i}try {{\n"
              f"{i}  await deliverEvent(payload);\n"
              f"{i}  if (eventQueue[0] === entry && (Number(entry.revision) || 0) === revision) {{\n"
              f"{i}    eventQueue.shift();\n"
              f"{i}  }} else {{\n"
              f"{i}    entry.attempts = 0;\n"
              f"{i}    entry.nextAttemptAt = 0;\n"
              f"{i}  }}\n"
              f"{i}  lastReceiverError = null;\n"
              f"{i}  await persistQueue();\n"
              f"{i}}} catch (error) {{"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          merge = re.compile(
              r'(?P<i>\s*)eventQueue\[existingIndex\]\.payload = mergePayload\(eventQueue\[existingIndex\]\.payload, payload\);\n'
              r'(?P=i)eventQueue\[existingIndex\]\.attempts = 0;\n'
              r'(?P=i)eventQueue\[existingIndex\]\.nextAttemptAt = 0;'
          )
          match = merge.search(text)
          if not match:
              raise SystemExit("queue merge marker not found")
          i = match.group('i')
          replacement = (
              f"{i}eventQueue[existingIndex].payload = mergePayload(eventQueue[existingIndex].payload, payload);\n"
              f"{i}eventQueue[existingIndex].revision = (Number(eventQueue[existingIndex].revision) || 0) + 1;\n"
              f"{i}eventQueue[existingIndex].attempts = 0;\n"
              f"{i}eventQueue[existingIndex].nextAttemptAt = 0;"
          )
          text = text[:match.start()] + replacement + text[match.end():]

          text, count = re.subn(
              r'eventQueue\.push\(\{ payload, attempts: 0, nextAttemptAt: 0 \}\);',
              'eventQueue.push({ payload, attempts: 0, nextAttemptAt: 0, revision: 0 });',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("queue push marker not found")

          restore = re.compile(
              r'(?P<i>\s*)\? values\[QUEUE_STORAGE_KEY\]\.filter\(\(entry\) => entry && entry\.payload && entry\.payload\.eventId\)\.slice\(-MAX_QUEUE_LENGTH\)\n'
              r'(?P=i): \[\];'
          )
          match = restore.search(text)
          if not match:
              raise SystemExit("queue restore marker not found")
          i = match.group('i')
          replacement = (
              f"{i}? values[QUEUE_STORAGE_KEY]\n"
              f"{i}    .filter((entry) => entry && entry.payload && entry.payload.eventId)\n"
              f"{i}    .slice(-MAX_QUEUE_LENGTH)\n"
              f"{i}    .map((entry) => ({{\n"
              f"{i}      ...entry,\n"
              f"{i}      revision: Number(entry.revision) || 0,\n"
              f"{i}      attempts: Math.max(0, Number(entry.attempts) || 0),\n"
              f"{i}      nextAttemptAt: Math.max(0, Number(entry.nextAttemptAt) || 0)\n"
              f"{i}    }}))\n"
              f"{i}: [];"
          )
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text)
          PY
          node --check browser-extension/service_worker.js
          grep -q 'entry.revision' browser-extension/service_worker.js
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/service_worker.js
          git commit -m "preserve updated queue revisions during in-flight delivery"
          git pull --rebase origin agent/v060-reliability-e2e
          git push origin HEAD:agent/v060-reliability-e2e
