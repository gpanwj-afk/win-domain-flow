name: v050-clippy-fix

on:
  push:
    branches:
      - agent/v050-responsive-browser-diagnostics
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v050-responsive-browser-diagnostics

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Apply browser UI quality fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/browser_ui.rs")
          text = path.read_text()
          old_format = '''                egui::RichText::new(format!(
                      "扩展只向本机 127.0.0.1:{} 发送元数据，不上传正文。",
                      BROWSER_DIAGNOSTICS_PORT
                  ))
          '''
          new_format = '''                egui::RichText::new(format!(
                      "扩展只向本机 127.0.0.1:{BROWSER_DIAGNOSTICS_PORT} 发送元数据，不上传正文。"
                  ))
          '''
          if old_format not in text:
              raise SystemExit("port format marker not found")
          text = text.replace(old_format, new_format, 1)

          start = text.index("fn open_extension_folder()")
          end = text.index("\n#[cfg(test)]", start)
          replacement = '''#[cfg(windows)]
          fn open_extension_folder() -> Result<(), String> {
              let folder = extension_dir();
              if !folder.is_dir() {
                  return Err(format!("未找到浏览器扩展目录：{}", folder.display()));
              }
              std::process::Command::new("explorer.exe")
                  .arg(&folder)
                  .spawn()
                  .map_err(|error| format!("无法打开扩展目录：{error}"))?;
              Ok(())
          }

          #[cfg(not(windows))]
          fn open_extension_folder() -> Result<(), String> {
              Err(format!("扩展目录：{}", extension_dir().display()))
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt

      - name: Commit source fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/browser_ui.rs
          git commit -m "fix browser diagnostics quality warnings"
          git push
