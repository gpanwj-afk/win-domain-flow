name: repair-v060-e2e

on:
  push:
    branches:
      - agent/v060-reliability-e2e

permissions:
  contents: write

# Temporary release-repair workflow. It will be deleted before PR #7 is merged.
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair PowerShell scalar browser discovery
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/validate-windows.ps1")
          text = path.read_text(encoding="utf-8")
          old = '''    $candidates = @(
              "$env:ProgramFiles(x86)\\Microsoft\\Edge\\Application\\msedge.exe",
              "$env:ProgramFiles\\Microsoft\\Edge\\Application\\msedge.exe",
              "$env:LOCALAPPDATA\\Microsoft\\Edge\\Application\\msedge.exe",
              "$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe",
              "$env:ProgramFiles(x86)\\Google\\Chrome\\Application\\chrome.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          '''
          new = '''    $candidates = @(@(
              "$env:ProgramFiles(x86)\\Microsoft\\Edge\\Application\\msedge.exe",
              "$env:ProgramFiles\\Microsoft\\Edge\\Application\\msedge.exe",
              "$env:LOCALAPPDATA\\Microsoft\\Edge\\Application\\msedge.exe",
              "$env:ProgramFiles\\Google\\Chrome\\Application\\chrome.exe",
              "$env:ProgramFiles(x86)\\Google\\Chrome\\Application\\chrome.exe"
          ) | Where-Object { $_ -and (Test-Path $_) })
          '''
          if old not in text:
              if new in text:
                  print("repair already applied")
              else:
                  raise SystemExit("expected Get-BrowserExecutable block not found")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit repair when needed
        shell: bash
        run: |
          set -euo pipefail
          git add tools/validate-windows.ps1
          if git diff --cached --quiet; then
            echo "No repair commit required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair E2E browser discovery"
          git push origin HEAD:agent/v060-reliability-e2e
