name: v050-product-fix3

on:
  push:
    branches:
      - agent/v050-responsive-browser-diagnostics
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden-and-wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v050-responsive-browser-diagnostics
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libpcap-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply validated backend and responsive GUI transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/v050-product-fix.yml").read_text()
          marker = "python3 - <<'PY'\n"
          scripts = []
          cursor = 0
          while True:
              start = workflow.find(marker, cursor)
              if start < 0:
                  break
              start += len(marker)
              end = workflow.find("\n          PY", start)
              if end < 0:
                  raise SystemExit("unterminated transformation block")
              scripts.append(textwrap.dedent(workflow[start:end]))
              cursor = end + 1

          if len(scripts) < 3:
              raise SystemExit(f"expected 3 transformation scripts, found {len(scripts)}")
          exec(compile(scripts[0], "browser_activity_transform", "exec"), {})
          exec(compile(scripts[2], "responsive_gui_transform", "exec"), {})
          PY

      - name: Update browser diagnostics UI by function boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/browser_ui.rs")
          text = path.read_text()

          text = text.replace(
              "按 document、media、fetch、script、image 等请求类型归类；大小为响应头声明值，并非所有请求都提供。",
              "按 document、media、fetch、script、image 等请求类型归类；优先使用浏览器记录的实际编码传输字节。",
              1,
          )
          summary_start = text.index("    fn render_resource_summary(")
          requests_start = text.index("    fn render_requests(", summary_start)
          summary = text[summary_start:requests_start].replace(
              "row.declared_bytes", "row.measured_bytes"
          )
          summary = summary.replace(
              "{} 次请求 · {} 次大小未知",
              "{} 次请求 · {} 次大小未知（实际字节缺失时回退响应声明）",
              1,
          )
          text = text[:summary_start] + summary + text[requests_start:]

          text = text.replace(
              "用 URL 路径、资源类型、MIME、状态码与来源页面判断大流量是视频分片、接口数据、脚本、图片还是其他资源。",
              "按实际传输字节从大到小排列 URL，再结合资源类型、MIME、协议、缓存状态与来源页面判断用途。",
              1,
          )

          card_start = text.index("fn request_card(")
          card_end = text.index("fn empty_hint", card_start)
          card = text[card_start:card_end]
          pattern = re.compile(
              r'ui\.label\(\s*egui::RichText::new\(\s*row\.declared_bytes\s*'
              r'\.map\(format_bytes\)\s*\.unwrap_or_else\(\|\| "响应大小未知"\.to_string\(\)\),\s*'
              r'\)\s*\.strong\(\)\s*\.color\(palette\.blue\),\s*\);',
              re.S,
          )
          replacement = '''let (size_label, size_color) = if let Some(bytes) = row.transferred_bytes {
                          (format!("实际传输 {}", format_bytes(bytes)), palette.blue)
                      } else if let Some(bytes) = row.declared_bytes {
                          (format!("响应声明 {}", format_bytes(bytes)), palette.amber)
                      } else {
                          ("大小未知".to_string(), palette.muted)
                      };
                      ui.label(
                          egui::RichText::new(size_label)
                              .strong()
                              .color(size_color),
                      );'''
          card, count = pattern.subn(replacement, card, count=1)
          if count != 1:
              raise SystemExit("request size expression not found")

          method_pattern = re.compile(
              r'if let Some\(method\) = &row\.method \{\s*'
              r'status_chip\(ui, method, palette\.muted, palette\);\s*\}',
              re.S,
          )
          method_replacement = '''if let Some(protocol) = &row.protocol {
                      status_chip(ui, protocol, palette.blue, palette);
                  }
                  if row.from_cache == Some(true) {
                      status_chip(ui, "来自缓存", palette.amber, palette);
                  }
                  if let Some(method) = &row.method {
                      status_chip(ui, method, palette.muted, palette);
                  }'''
          card, count = method_pattern.subn(method_replacement, card, count=1)
          if count != 1:
              raise SystemExit("request method block not found")
          text = text[:card_start] + card + text[card_end:]
          path.write_text(text)
          PY

      - name: Validate and refresh lockfile
        run: |
          cargo fmt
          cargo check --all-targets
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo build --release
          node --check browser-extension/service_worker.js
          node --check browser-extension/popup.js
          python3 -m json.tool browser-extension/manifest.json >/dev/null

      - name: Commit product changes safely
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src
          if ! git diff --cached --quiet; then
            git commit -m "wire responsive UI and actual browser request diagnostics"
          fi
          git fetch origin agent/v050-responsive-browser-diagnostics
          git rebase origin/agent/v050-responsive-browser-diagnostics
          git push origin HEAD:agent/v050-responsive-browser-diagnostics
