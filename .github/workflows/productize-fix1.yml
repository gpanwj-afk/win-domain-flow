name: productize-fix1

on:
  push:
    branches:
      - agent/productize-cn-app-dashboard

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/productize-cn-app-dashboard
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gui = Path('src/gui.rs')
          text = gui.read_text()
          updated, count = re.subn(r'\n\s*\.show_percentage\(false\)', '', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one show_percentage(false), found {count}')
          gui.write_text(updated)

          storage = Path('src/app_storage.rs')
          text = storage.read_text()
          start = text.index('        let rows = if let Some(application) = application {')
          end = text.index('        Ok(rows)\n', start) + len('        Ok(rows)\n')
          replacement = '''        let rows = if let Some(application) = application {
              let mut statement = self.conn.prepare(TOP_DOMAINS_FOR_APPLICATION_SQL)?;
              let mapped = statement.query_map(
                  params![lower_bound, application, i64::from(limit)],
                  map_domain_row,
              )?;
              let collected = mapped.collect::<Result<Vec<_>, _>>()?;
              collected
          } else {
              let mut statement = self.conn.prepare(TOP_DOMAINS_ALL_SQL)?;
              let mapped =
                  statement.query_map(params![lower_bound, i64::from(limit)], map_domain_row)?;
              let collected = mapped.collect::<Result<Vec<_>, _>>()?;
              collected
          };
          Ok(rows)
          '''
          storage.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt
          ! grep -R "show_percentage(false)" src/gui.rs
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/gui.rs src/app_storage.rs
            git commit -m "fix product dashboard compilation"
            git push
          fi
