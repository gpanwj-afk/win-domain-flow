name: productize-fix2

on:
  push:
    branches:
      - agent/productize-cn-app-dashboard

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/productize-cn-app-dashboard
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply database and clippy fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          storage = Path('src/app_storage.rs')
          text = storage.read_text()
          old = '''         FROM domain_daily
         ON CONFLICT(day_start_utc, application, domain) DO NOTHING'''
          new = '''         FROM domain_daily
         WHERE true
         ON CONFLICT(day_start_utc, application, domain) DO NOTHING'''
          if old not in text:
              raise SystemExit('historical migration SQL marker not found')
          text = text.replace(old, new, 1)
          old_collect = '''            let collected = mapped.collect::<Result<Vec<_>, _>>()?;
            collected'''
          count = text.count(old_collect)
          if count != 2:
              raise SystemExit(f'expected two collected bindings, found {count}')
          text = text.replace(
              old_collect,
              '''            mapped.collect::<Result<Vec<_>, _>>()?''',
          )
          storage.write_text(text)

          attribution = Path('src/attribution.rs')
          text = attribution.read_text()
          create_block = '''    pub fn create() -> Box<dyn ProcessAttributor> {
        Box::new(WindowsProcessAttributor::default())
    }
'''
          if text.count(create_block) != 1:
              raise SystemExit('windows create block not found exactly once')
          text = text.replace(create_block, '', 1)
          test_marker = '    #[cfg(test)]\n    mod tests {'
          if test_marker not in text:
              raise SystemExit('windows tests marker not found')
          text = text.replace(test_marker, create_block + '\n' + test_marker, 1)
          old_factory = '''pub fn create_process_attributor() -> Box<dyn ProcessAttributor> {
    #[cfg(windows)]
    {
        return windows_backend::create();
    }

    #[cfg(not(windows))]
    {
        Box::new(NoopProcessAttributor)
    }
}
'''
          new_factory = '''pub fn create_process_attributor() -> Box<dyn ProcessAttributor> {
    #[cfg(windows)]
    {
        windows_backend::create()
    }

    #[cfg(not(windows))]
    {
        Box::new(NoopProcessAttributor)
    }
}
'''
          if old_factory not in text:
              raise SystemExit('factory block not found')
          attribution.write_text(text.replace(old_factory, new_factory, 1))

          settings = Path('src/settings.rs')
          text = settings.read_text()
          old_windows = '''    #[cfg(windows)]
    {
        return std::env::var_os("LOCALAPPDATA").map(PathBuf::from);
    }
'''
          new_windows = '''    #[cfg(windows)]
    {
        std::env::var_os("LOCALAPPDATA").map(PathBuf::from)
    }
'''
          if old_windows not in text:
              raise SystemExit('settings windows branch not found')
          settings.write_text(text.replace(old_windows, new_windows, 1))
          PY
          cargo fmt
          git diff --check
          grep -q "WHERE true" src/app_storage.rs
          ! grep -q "let collected = mapped.collect" src/app_storage.rs
      - name: Commit fixes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app_storage.rs src/attribution.rs src/settings.rs
            git commit -m "fix product migration and lint findings"
            git push
          fi
