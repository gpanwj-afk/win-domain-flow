name: gui-fix-once

on:
  push:
    branches:
      - agent/add-gui-dashboard

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-gui-dashboard
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Fix status tooltip
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/gui.rs")
          text = path.read_text()
          old = '''    ui.colored_label(color, text);
              if let CaptureState::Failed(error) = state {
                  ui.on_hover_text(error);
              }
          }
          '''
          new = '''    let response = ui.colored_label(color, text);
              if let CaptureState::Failed(error) = state {
                  response.on_hover_text(error);
              }
          }
          '''
          if old not in text:
              raise SystemExit("status badge marker not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/gui.rs
            git commit -m "fix GUI status tooltip"
            git push
          fi
